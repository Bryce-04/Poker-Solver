[project]
name = "poker-solver-schema"
version = "0.1.0"
description = "Single source of truth for the Spot data model. Python (Pydantic) here; TypeScript types are generated from it, never hand-duplicated."
requires-python = ">=3.11"
dependencies = [
    "pydantic[email]>=2.9",
]

[project.optional-dependencies]
codegen = [
    "pydantic2ts>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_solver_schema"]
