<!--
  Adaptive-icon foreground: a spade. The app's own mark (favicon.svg's
  bolt) reads as "solver," not "poker," and the home-screen icon is worth
  the one glance that actually says what this app is. Built from a
  standard heart-glyph path rotated 180 degrees (a spade is a heart's
  lobes plus a stem where the heart's top cleft would be) rather than
  hand-drawn, to keep the lobes clean; the stem is a plain triangle sized
  generously so it reads as a stem instead of leaving the heart's cleft
  peeking through. Kept inside Android's adaptive-icon safe zone (content
  within roughly the center 60 percent of the canvas).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g transform="translate(238.76,151.66) scale(22.77)">
    <g transform="rotate(180,12,12)">
      <path fill="#ffffff" d="M12,21.35 L10.55,20.03 C5.4,15.36 2,12.28 2,8.5 C2,5.42 4.42,3 7.5,3 C9.24,3 10.91,3.81 12,5.09 C13.09,3.81 14.76,3 16.5,3 C19.58,3 22,5.42 22,8.5 C22,12.28 18.6,15.36 13.45,20.03 L12,21.35 Z"/>
    </g>
    <polygon fill="#ffffff" points="7,17 17,17 12,29"/>
  </g>
</svg>
