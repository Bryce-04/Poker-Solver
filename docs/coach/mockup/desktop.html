<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Coach · desktop (click the saved conversations)</title>
<!-- Design mockup for docs/coach.md. Reference only: do not ship.
     Data shown (ranges, strategy %, saved spots) is placeholder. -->
<style>
body{margin:0;background:#131318}
a{color:#c4b5fd}a:hover{color:#ddd6fe}
.nav{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:8px;text-decoration:none;color:#b7b5c3}
.nav:hover{background:#22222b;color:#f4f3f8}
.nav[aria-current=page]{background:rgba(167,139,250,.14);color:#f4f3f8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:8px;font:600 14px/1.3 system-ui,'Segoe UI',Roboto,sans-serif;cursor:pointer;text-decoration:none;border:1px solid transparent;box-sizing:border-box}
.btn-primary{background:#a78bfa;color:#1a1030}
.btn-primary:hover{background:#c4b5fd;color:#1a1030}
.btn-secondary{background:#24242e;color:#f4f3f8;border-color:#43424f}
.btn-secondary:hover{background:#2c2c38;color:#f4f3f8}
.btn-ghost{background:transparent;color:#b7b5c3}
.btn-ghost:hover{background:#22222b;color:#f4f3f8}
.conv{width:100%;text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:10px;border:1px solid transparent;background:transparent;color:#b7b5c3;font:inherit;cursor:pointer}
.conv:hover{background:#1b1b23}
.conv[aria-current=true]{background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.35)}
.starter{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid #34343f;background:#1b1b23;color:#f4f3f8;font:500 14px/1.4 system-ui,'Segoe UI',Roboto,sans-serif;cursor:pointer}
.starter:hover{border-color:#a78bfa}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #a78bfa;outline-offset:2px}
input,textarea{font:inherit;color:#f4f3f8;background:#131318;border:1px solid #43424f;border-radius:8px;padding:0 12px;min-height:40px;box-sizing:border-box}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style>
</head>
<body>
<div id="app" style=""></div>
<script type="text/x-template" id="dc-template">

<div style="height: 100vh; display: flex; flex-wrap: wrap; background: #131318; color: #b7b5c3; font: 14px/1.5 system-ui, 'Segoe UI', Roboto, sans-serif">

  <nav aria-label="Main" style="flex: 1 1 232px; box-sizing: border-box; background: #17171e; border-right: 1px solid #2a2a34; padding: 20px 14px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2 4 14h6.5L9 22l11-13h-6.5L14 2z" fill="#a78bfa"></path></svg>
      <span style="font-size: 17px; font-weight: 700; color: #f4f3f8">Poker Solver</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <a class="nav" href="#solve"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="margin-top: 2px; flex: none"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg><span style="display: flex; flex-direction: column"><span style="font-weight: 600">Solve</span><span style="font-size: 12px; color: #8a8899">Best play after the flop</span></span></a>
      <a class="nav" href="#ranges"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="margin-top: 2px; flex: none"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg><span style="display: flex; flex-direction: column"><span style="font-weight: 600">Ranges</span><span style="font-size: 12px; color: #8a8899">Which hands to play preflop</span></span></a>
      <a class="nav" href="desktop.html" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px; flex: none"><path d="M4 5h16v11H9l-5 4V5z"></path></svg><span style="display: flex; flex-direction: column"><span style="font-weight: 600">Coach</span><span style="font-size: 12px; color: #8a8899">Ask about a spot</span></span></a>
      <a class="nav" href="#library"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px; flex: none"><path d="M6 3h12v18l-6-4-6 4V3z"></path></svg><span style="display: flex; flex-direction: column"><span style="font-weight: 600">Library</span><span style="font-size: 12px; color: #8a8899">Saved spots and chats</span></span></a>
      <a class="nav" href="#drill"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px; flex: none"><rect x="3" y="6" width="11" height="15" rx="2"></rect><path d="M9 3h10a2 2 0 0 1 2 2v12"></path></svg><span style="display: flex; flex-direction: column"><span style="font-weight: 600">Drill</span><span style="font-size: 12px; color: #8a8899">Practice game · full screen</span></span></a>
    </div>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 0 6px">
      <span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 50%; background: #2c2c38; color: #f4f3f8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none">P</span>
      <span style="flex: 1; min-width: 0; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">peyt0303@gmail.com</span>
      <button type="button" class="btn btn-ghost" style="min-height: 32px; padding: 0 8px; font-size: 12px">Sign out</button>
    </div>
  </nav>

  <main style="flex: 999 1 640px; min-width: 0; min-height: 0; height: 100%; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 22px 32px; border-bottom: 1px solid #2a2a34">
      <div>
        <h1 style="margin: 0; font-size: 22px; font-weight: 700; color: #f4f3f8">Coach</h1>
        <p style="margin: 2px 0 0; color: #8a8899">Describe a spot in your own words. The solver works out the play, and the Coach explains it.</p>
      </div>
      <button type="button" class="btn btn-primary" onClick="{{newChat}}">New conversation</button>
    </header>

    <div style="display: flex; flex-wrap: wrap; flex: 1; min-height: 0">
      <aside aria-label="Conversations" style="flex: 1 1 280px; max-width: 320px; max-height: 100%; overflow-y: auto; box-sizing: border-box; border-right: 1px solid #2a2a34; padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <label><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search conversations</span><input type="text" placeholder="Search conversations" style="width: 100%"></label>
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8a8899; padding: 6px 4px 0">Saved conversations</span>
        <sc-for list="{{convs}}" as="c" hint-placeholder-count="3">
          <button type="button" class="conv" aria-current="{{c.current}}" onClick="{{c.pick}}">
            <span style="color: #f4f3f8; font-weight: 600">{{c.title}}</span>
            <span style="font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.preview}}</span>
            <span style="font-size: 11px; color: #8a8899">{{c.when}}</span>
          </button>
        </sc-for>
      </aside>

      <section aria-label="Conversation" style="flex: 999 1 560px; min-width: 0; height: 100%; display: flex; flex-direction: column">
        <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 28px 32px; display: flex; flex-direction: column">
          <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
            <div style="max-width: 640px; width: 100%; margin: 40px auto 0; display: flex; flex-direction: column; gap: 16px">
              <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 50%; background: rgba(167,139,250,.16); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M14 2 4 14h6.5L9 22l11-13h-6.5L14 2z" fill="#a78bfa"></path></svg></span>
              <h2 style="margin: 0; font-size: 26px; color: #f4f3f8; letter-spacing: -0.01em">What spot are you studying?</h2>
              <p style="margin: 0; font-size: 15px">Tell me your cards, your position, the board and what happened. I'll build the spot, run the solver, and explain what it does and why.</p>
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 8px">
                <button type="button" class="starter">“I have A♥ Q♦ on the button and the flop is Q♠ 5♣ 2♣. What should I do?”</button>
                <button type="button" class="starter">“BB here. BTN raised to 2.5bb. Should I call with 7♠ 6♠?”</button>
                <button type="button" class="starter">“Why does the solver check so many strong hands?”</button>
                <button type="button" class="starter">“Paste a hand history and ask about one decision”</button>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{hasMessages}}" hint-placeholder-val="{{ true }}">
            <div style="max-width: 760px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 18px">
              <sc-for list="{{blocks}}" as="b" hint-placeholder-count="5">
                <sc-if value="{{b.isUser}}" hint-placeholder-val="{{ false }}">
                  <div style="align-self: flex-end; max-width: 78%; padding: 12px 16px; border-radius: 16px 16px 4px 16px; background: #2c2c38; color: #f4f3f8; font-size: 15px">{{b.text}}</div>
                </sc-if>
                <sc-if value="{{b.isAssume}}" hint-placeholder-val="{{ false }}">
                  <div style="display: flex; gap: 12px; align-items: flex-start">
                    <span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 50%; background: rgba(167,139,250,.16); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M14 2 4 14h6.5L9 22l11-13h-6.5L14 2z" fill="#a78bfa"></path></svg></span>
                    <p style="margin: 3px 0 0; font-size: 15px; color: #d6d4e0">{{b.text}}</p>
                  </div>
                </sc-if>
                <sc-if value="{{b.isText}}" hint-placeholder-val="{{ false }}">
                  <div style="margin-left: 40px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: #d6d4e0">
                    <sc-for list="{{b.paras}}" as="p" hint-placeholder-count="2"><p style="margin: 0">{{p}}</p></sc-for>
                    <sc-if value="{{b.note}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 12px; color: #8a8899">{{b.note}}</p></sc-if>
                  </div>
                </sc-if>
                <sc-if value="{{b.isSpot}}" hint-placeholder-val="{{ false }}">
                  <div style="margin-left: 40px; border: 1px solid #2f2f3a; border-radius: 14px; background: #1b1b23; overflow: hidden">
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid #2a2a34">
                      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8a8899">The spot I understood</span>
                      <span style="display: flex; gap: 6px"><button type="button" class="btn btn-ghost" style="min-height: 32px; padding: 0 10px; font-size: 13px">Edit</button><a href="#solve" class="btn btn-secondary" style="min-height: 32px; padding: 0 12px; font-size: 13px">Open in Solve</a></span>
                    </div>
                    <div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 16px">
                      <div style="display: flex; flex-direction: column; gap: 6px">
                        <span style="font-size: 12px; color: #8a8899">Your hand</span>
                        <span style="display: flex; gap: 5px"><sc-for list="{{b.hero}}" as="c" hint-placeholder-count="2"><span role="img" aria-label="{{c.aria}}" style="width: 38px; height: 54px; border-radius: 6px; background: #ffffff; color: {{c.color}}; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 750 16px/1 system-ui, 'Segoe UI', Roboto, sans-serif"><span>{{c.r}}</span><span>{{c.s}}</span></span></sc-for></span>
                      </div>
                      <div style="display: flex; flex-direction: column; gap: 6px">
                        <span style="font-size: 12px; color: #8a8899">Board</span>
                        <span style="display: flex; gap: 5px"><sc-for list="{{b.board}}" as="c" hint-placeholder-count="3"><span role="img" aria-label="{{c.aria}}" style="width: 38px; height: 54px; border-radius: 6px; background: #ffffff; color: {{c.color}}; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 750 16px/1 system-ui, 'Segoe UI', Roboto, sans-serif"><span>{{c.r}}</span><span>{{c.s}}</span></span></sc-for></span>
                      </div>
                      <dl style="margin: 0; flex: 1 1 220px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; font-size: 13px">
                        <sc-for list="{{b.facts}}" as="f" hint-placeholder-count="4"><div><dt style="color: #8a8899; font-size: 12px">{{f.k}}</dt><dd style="margin: 0; color: #f4f3f8">{{f.v}}</dd></div></sc-for>
                      </dl>
                    </div>
                  </div>
                </sc-if>
                <sc-if value="{{b.isResult}}" hint-placeholder-val="{{ false }}">
                  <div style="margin-left: 40px; border: 1px solid rgba(167,139,250,.35); border-radius: 14px; background: #1d1b28; padding: 16px; display: flex; flex-direction: column; gap: 12px">
                    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
                      <span style="color: #f4f3f8; font-weight: 650; font-size: 15px">{{b.title}}</span>
                      <span style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; background: rgba(70,176,106,.14); color: #7fd39b; font-size: 12px; font-weight: 650"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>{{b.accuracy}}</span>
                    </div>
                    <sc-for list="{{b.rows}}" as="row" hint-placeholder-count="3">
                      <div style="display: grid; grid-template-columns: 170px minmax(0, 1fr) 44px; gap: 12px; align-items: center; font-size: 14px; color: #f4f3f8">
                        <span>{{row.label}}</span>
                        <span style="height: 10px; border-radius: 5px; background: #2b2b34; overflow: hidden; display: block"><span style="display: block; height: 100%; width: {{row.pct}}; background: {{row.color}}"></span></span>
                        <span style="text-align: right; font-weight: 700; font-variant-numeric: tabular-nums">{{row.pct}}</span>
                      </div>
                    </sc-for>
                  </div>
                </sc-if>
                <sc-if value="{{b.isSolving}}" hint-placeholder-val="{{ false }}">
                  <div style="margin-left: 40px; border: 1px solid #2f2f3a; border-radius: 14px; background: #1b1b23; padding: 16px; display: flex; flex-direction: column; gap: 10px">
                    <span style="color: #f4f3f8; font-weight: 650">Solving the CO's flop decision…</span>
                    <span role="progressbar" aria-label="Solving" style="display: block; height: 6px; border-radius: 3px; background: #2b2b34; overflow: hidden"><span style="display: block; width: 40%; height: 100%; background: #a78bfa; border-radius: 3px; animation: slide 1.4s ease-in-out infinite"></span></span>
                    <span style="font-size: 13px">Usually 10–90 seconds. You can leave this page; the answer will be here when you come back.</span>
                  </div>
                </sc-if>
                <sc-if value="{{b.isGeneral}}" hint-placeholder-val="{{ false }}">
                  <div style="margin-left: 40px; border: 1px solid rgba(240,185,61,.4); border-radius: 14px; background: rgba(240,185,61,.06); padding: 16px; display: flex; flex-direction: column; gap: 8px">
                    <span style="display: inline-flex; align-self: flex-start; padding: 2px 10px; border-radius: 999px; background: rgba(240,185,61,.16); color: #f0c766; font-size: 12px; font-weight: 650">General advice · not from the solver</span>
                    <sc-for list="{{b.paras}}" as="p" hint-placeholder-count="2"><p style="margin: 0; font-size: 15px; color: #d6d4e0">{{p}}</p></sc-for>
                  </div>
                </sc-if>
                <sc-if value="{{b.isButtons}}" hint-placeholder-val="{{ false }}">
                  <div style="margin-left: 40px; display: flex; flex-wrap: wrap; gap: 8px">
                    <sc-for list="{{b.buttons}}" as="x" hint-placeholder-count="2"><button type="button" class="btn btn-secondary">{{x}}</button></sc-for>
                  </div>
                </sc-if>
              </sc-for>
            </div>
          </sc-if>
        </div>

        <div style="flex: none; padding: 12px 32px 16px; background: #131318; border-top: 1px solid #2a2a34">
          <div style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px">
            <div style="border: 1px solid #43424f; border-radius: 14px; background: #1b1b23; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
              <label><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message the Coach</span>
                <textarea rows="2" placeholder="Describe your spot: your cards, position, the board, and what happened…" style="width: 100%; border: 0; background: transparent; padding: 4px; resize: none; font-size: 15px"></textarea>
              </label>
              <div style="display: flex; align-items: center; gap: 6px">
                <button type="button" class="btn btn-ghost" style="min-height: 34px; padding: 0 10px; font-size: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="3" width="12" height="17" rx="2"></rect><path d="M11 8v6M8 11h6"></path></svg>Add cards</button>
                <button type="button" class="btn btn-ghost" style="min-height: 34px; padding: 0 10px; font-size: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v3H8zM6 6H5v15h14V6h-1"></path></svg>Paste hand history</button>
                <span style="flex: 1"></span>
                <button type="button" class="btn btn-primary" aria-label="Send" style="min-height: 38px; width: 44px; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
              </div>
            </div>
            <p style="margin: 0; font-size: 12px; color: #8a8899; text-align: center">Study tool: review spots after you play, not during a hand. Messages are processed by Google Gemini. 22 of 25 messages left today.</p>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>
</script>
<script type="text/x-dc-logic" id="dc-logic">
var RED = '#c0362c', BLK = '#141319';
function card(r, s) {
  var names = { '♠': 'spades', '♥': 'hearts', '♦': 'diamonds', '♣': 'clubs' };
  return { r: r, s: s, color: (s === '♥' || s === '♦') ? RED : BLK, aria: r + ' of ' + names[s] };
}
function blk(type, o) { var b = { isUser: false, isAssume: false, isText: false, isSpot: false, isResult: false, isSolving: false, isGeneral: false, isButtons: false, note: '' }; b['is' + type] = true; return Object.assign(b, o); }
var THREADS = [
  { title: 'AQ on the button, Q-5-2 flop', preview: 'Bet small most of the time…', when: 'Today, 9:41 AM', blocks: [
    blk('User', { text: 'I’m on the button with A♥ Q♦. I raised, the big blind called. The flop is Q♠ 5♣ 2♣ and he checked to me. What should I do?' }),
    blk('Assume', { text: 'I’m assuming 100bb stacks, 6-max, a 2.5bb open, and standard ranges for a button open and a big blind call. Tell me if any of that is different.' }),
    blk('Spot', { hero: [card('A', '♥'), card('Q', '♦')], board: [card('Q', '♠'), card('5', '♣'), card('2', '♣')],
      facts: [{ k: 'You', v: 'BTN (acts last)' }, { k: 'Opponent', v: 'BB (checked)' }, { k: 'Pot', v: '5.5bb' }, { k: 'Stacks', v: '97.5bb' }] }),
    blk('Result', { title: 'Solver’s play with A♥ Q♦', accuracy: 'Very accurate · solved in 21s', rows: [
      { label: 'Bet small (1.4bb)', pct: '55%', color: '#f0897c' }, { label: 'Check', pct: '30%', color: '#f0b93d' }, { label: 'Bet medium (4.1bb)', pct: '15%', color: '#e8654f' }] }),
    blk('Text', { paras: [
      'Bet small most of the time: about 1.4bb, a quarter of the pot. You have top pair with the best kicker, so you’re ahead of almost everything BB calls with, and a small bet still gets called by weaker queens, fives and club draws.',
      'Checking about a third of the time is fine too. It means your checks aren’t all weak hands, so BB can’t attack them freely.'],
      note: 'The percentages come from the solver. The explanation is standard strategy reasoning.' }),
    blk('User', { text: 'What if he check-raises me?' }),
    blk('Text', { paras: ['That’s a new decision for you, so I need to solve it. I’ll add “you bet 1.4bb, BB raises” to the hand. You didn’t give a raise size, so I’ll use the solver’s standard size.'] }),
    blk('Buttons', { buttons: ['Solve it (about 30 seconds)', 'Change the raise size'] })
  ] },
  { title: 'JT suited on the CO, 9-8-2', preview: 'Solving…', when: 'Today, 9:55 AM', blocks: [
    blk('User', { text: 'CO open with J♠ T♠, BB calls. Flop 9♥ 8♣ 2♦ and BB checks. Bet or check?' }),
    blk('Assume', { text: 'Assuming 100bb, 6-max, a 2.5bb open and standard ranges. You have an open-ended straight draw, so this one is interesting. Solving now.' }),
    blk('Spot', { hero: [card('J', '♠'), card('T', '♠')], board: [card('9', '♥'), card('8', '♣'), card('2', '♦')],
      facts: [{ k: 'You', v: 'CO (acts last)' }, { k: 'Opponent', v: 'BB (checked)' }, { k: 'Pot', v: '5.5bb' }, { k: 'Stacks', v: '97.5bb' }] }),
    blk('Solving', {})
  ] },
  { title: 'KK in a three-way pot', preview: 'I can’t solve three-player pots yet…', when: 'Yesterday', blocks: [
    blk('User', { text: 'Three-way pot: I have K♠ K♥ on the button, SB and BB both call my raise. Flop A♦ 7♣ 3♠, they both check. Bet or check?' }),
    blk('Assume', { text: 'I can’t solve this one exactly: the solver handles two players, and this pot has three. Here’s what I can offer instead.' }),
    blk('General', { paras: [
      'With an ace on the board, KK loses to any ace, and with two opponents it’s more likely one of them has one.',
      'Many players check here to keep the pot small and decide on the turn. A small bet can still get called by sevens, threes and pocket pairs.'] }),
    blk('Buttons', { buttons: ['Solve it as heads-up vs the BB', 'What can the solver handle?'] })
  ] }
];

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 0 }; }
  renderVals() {
    var self = this, sel = this.state.sel;
    var t = sel >= 0 ? THREADS[sel] : null;
    return {
      convs: THREADS.map(function (c, i) { return { title: c.title, preview: c.preview, when: c.when, current: String(i === sel), pick: function () { self.setState({ sel: i }); } }; }),
      isEmpty: !t, hasMessages: !!t,
      blocks: t ? t.blocks : [],
      newChat: function () { self.setState({ sel: -1 }); }
    };
  }
}
</script>
<script>/* Tiny standalone renderer for the mockup screens: {{holes}}, <sc-for>,
   <sc-if>, onClick handlers, and a DCLogic base class with setState. */
(function () {
  var TABLE_TAGS = ['table', 'thead', 'tbody', 'tr', 'td', 'th'];
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  function lookup(path, scope) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) {
      var v = lookup(p, scope);
      return v == null ? '' : String(v);
    });
  }

  window.DCLogic = class {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(patch) {
      this.state = Object.assign({}, this.state, typeof patch === 'function' ? patch(this.state) : patch);
      this.__rerender && this.__rerender();
    }
    forceUpdate() { this.__rerender && this.__rerender(); }
  };

  function renderNode(node, scope, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = lookup(node.getAttribute('list').replace(WHOLE, '$1'), scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        node.childNodes.forEach(function (c) { renderNode(c, s, out); });
      });
      return;
    }
    if (tag === 'sc-if') {
      if (lookup(node.getAttribute('value').replace(WHOLE, '$1'), scope)) {
        node.childNodes.forEach(function (c) { renderNode(c, scope, out); });
      }
      return;
    }
    var realTag = tag.indexOf('x-') === 0 && TABLE_TAGS.indexOf(tag.slice(2)) >= 0 ? tag.slice(2) : tag;
    var el = node.namespaceURI && node.namespaceURI !== 'http://www.w3.org/1999/xhtml'
      ? document.createElementNS(node.namespaceURI, realTag)
      : document.createElement(realTag);
    Array.prototype.forEach.call(node.attributes, function (a) {
      if (a.name.indexOf('hint-') === 0) return;
      var whole = a.value.match(WHOLE);
      if (/^on[a-z]+$/i.test(a.name) && whole) {
        var fn = lookup(whole[1], scope);
        if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn);
        return;
      }
      if (whole && a.name !== 'style') {
        var v = lookup(whole[1], scope);
        if (v === false || v == null) return;
        el.setAttribute(a.name, v === true ? '' : String(v));
        return;
      }
      el.setAttribute(a.name, interp(a.value, scope));
    });
    if (realTag === 'input' && node.hasAttribute('value')) el.value = interp(node.getAttribute('value'), scope);
    node.childNodes.forEach(function (c) { renderNode(c, scope, el.childNodes && { push: function (n) { el.appendChild(n); } }); });
    out.push(el);
  }

  window.addEventListener('DOMContentLoaded', function () {
    var src = document.getElementById('dc-template').textContent;
    TABLE_TAGS.forEach(function (t) {
      src = src.replace(new RegExp('<' + t + '(?=[\\s>])', 'g'), '<x-' + t).replace(new RegExp('</' + t + '>', 'g'), '</x-' + t + '>');
    });
    var holder = document.createElement('div');
    holder.innerHTML = src;
    var Component = new Function(document.getElementById('dc-logic').textContent + '\n;return Component;')();
    var inst = new Component({});
    var root = document.getElementById('app');
    inst.__rerender = function () {
      var out = [];
      var vals = inst.renderVals ? inst.renderVals() : {};
      holder.childNodes.forEach(function (c) { renderNode(c, vals, out); });
      root.replaceChildren.apply(root, out);
    };
    inst.__rerender();
    if (inst.componentDidMount) inst.componentDidMount();
  });
})();
</script>
