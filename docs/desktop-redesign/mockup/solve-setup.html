<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Solve — setting up a spot</title>
<!-- Design mockup for docs/desktop-redesign.md. Reference only: do not ship.
     Data shown (ranges, strategy %, saved spots) is placeholder. -->
<style>
body{margin:0;background:#131318}
a{color:#c4b5fd}a:hover{color:#ddd6fe}
.nav{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:8px;text-decoration:none;color:#b7b5c3}
.nav:hover{background:#22222b;color:#f4f3f8}
.nav[aria-current=page]{background:rgba(167,139,250,.14);color:#f4f3f8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:8px;font:600 14px/1.3 system-ui,'Segoe UI',Roboto,sans-serif;cursor:pointer;text-decoration:none;border:1px solid transparent;box-sizing:border-box}
.btn-primary{background:#a78bfa;color:#1a1030}
.btn-primary:hover{background:#c4b5fd;color:#1a1030}
.btn-secondary{background:#24242e;color:#f4f3f8;border-color:#43424f}
.btn-secondary:hover{background:#2c2c38;color:#f4f3f8}
.btn-ghost{background:transparent;color:#b7b5c3}
.btn-ghost:hover{background:#22222b;color:#f4f3f8}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;padding:3px;gap:2px;background:#131318;border:1px solid #2f2f3a;border-radius:9px}
.seg-item{white-space:nowrap;min-height:32px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:#b7b5c3;font:550 13px/1 system-ui,'Segoe UI',Roboto,sans-serif;cursor:pointer}
.seg-item:hover{color:#f4f3f8}
.seg-item[aria-pressed=true]{background:#2c2c38;color:#f4f3f8;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.cell{border:0;padding:0;aspect-ratio:1/1;border-radius:4px;font:650 12px/1 system-ui,'Segoe UI',Roboto,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:0}
.cell:hover{outline:2px solid #a78bfa;outline-offset:-2px}
.mini{border:0;padding:0;aspect-ratio:1/1;min-width:0;border-radius:1px}
.ptab{flex:1 1 0;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid #2f2f3a;background:#1b1b23;color:#b7b5c3;cursor:pointer;font:inherit}
.ptab[aria-pressed=true]{border-color:rgba(167,139,250,.6);background:rgba(167,139,250,.1);color:#f4f3f8}
.slot{width:52px;height:72px;border-radius:8px;border:0;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 20px/1 system-ui,'Segoe UI',Roboto,sans-serif}
.slot-empty{background:transparent;border:1.5px dashed #43424f;color:#8a8899;font:600 11px/1.2 system-ui,'Segoe UI',Roboto,sans-serif}
.slot-empty:hover{border-color:#a78bfa;color:#f4f3f8}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #a78bfa;outline-offset:2px}
select,input,textarea{font:inherit;color:#f4f3f8;background:#131318;border:1px solid #43424f;border-radius:8px;padding:0 12px;min-height:40px;box-sizing:border-box}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="dc-template">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #131318; color: #b7b5c3; font: 14px/1.5 system-ui, 'Segoe UI', Roboto, sans-serif">

  <!-- Sidebar -->
  <nav aria-label="Main" style="flex: 1 1 232px; box-sizing: border-box; background: #17171e; border-right: 1px solid #2a2a34; padding: 20px 14px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2 4 14h6.5L9 22l11-13h-6.5L14 2z" fill="#a78bfa"></path></svg>
      <span style="font-size: 17px; font-weight: 700; color: #f4f3f8; letter-spacing: -0.01em">Poker Solver</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <a class="nav" href="solve-setup.html" aria-current="page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="margin-top: 2px; flex: none"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
        <span style="display: flex; flex-direction: column"><span style="font-weight: 600">Solve</span><span style="font-size: 12px; color: #8a8899">Best play after the flop</span></span>
      </a>
      <a class="nav" href="ranges.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="margin-top: 2px; flex: none"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
        <span style="display: flex; flex-direction: column"><span style="font-weight: 600">Ranges</span><span style="font-size: 12px; color: #8a8899">Which hands to play preflop</span></span>
      </a>
      <a class="nav" href="library.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px; flex: none"><path d="M6 3h12v18l-6-4-6 4V3z"></path></svg>
        <span style="display: flex; flex-direction: column"><span style="font-weight: 600">Library</span><span style="font-size: 12px; color: #8a8899">Your saved spots</span></span>
      </a>
      <a class="nav" href="#drill">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px; flex: none"><rect x="3" y="6" width="11" height="15" rx="2"></rect><path d="M9 3h10a2 2 0 0 1 2 2v12"></path></svg>
        <span style="display: flex; flex-direction: column"><span style="font-weight: 600">Drill</span><span style="font-size: 12px; color: #8a8899">Practice game · full screen</span></span>
      </a>
    </div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
      <a href="#guide" style="display: block; text-decoration: none; padding: 14px; border-radius: 10px; background: #1f1d2b; border: 1px solid #34304a">
        <span style="display: block; color: #f4f3f8; font-weight: 600; font-size: 13px">New to solvers?</span>
        <span style="display: block; color: #b7b5c3; font-size: 12px; margin-top: 2px">A 2-minute guide to reading the charts</span>
      </a>
      <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
        <span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 50%; background: #2c2c38; color: #f4f3f8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none">P</span>
        <span style="flex: 1; min-width: 0; font-size: 12px; color: #b7b5c3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">peyt0303@gmail.com</span>
        <button type="button" class="btn btn-ghost" style="min-height: 32px; padding: 0 8px; font-size: 12px">Sign out</button>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 22px 32px; border-bottom: 1px solid #2a2a34">
      <div>
        <h1 style="margin: 0; font-size: 22px; font-weight: 700; color: #f4f3f8; letter-spacing: -0.01em">Solve</h1>
        <p style="margin: 2px 0 0; color: #8a8899">Set up a hand, then let the solver find the best mix of plays for whoever is to act.</p>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" class="btn btn-ghost">Start over</button>
        <button type="button" class="btn btn-secondary">Save spot</button>
      </div>
    </header>

    <div style="display: flex; flex-wrap: wrap; flex: 1">

      <!-- Setup rail -->
      <aside aria-label="Spot setup" style="flex: 1 1 340px; box-sizing: border-box; border-right: 1px solid #2a2a34; padding: 24px; display: flex; flex-direction: column; gap: 28px">

        <section style="display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between">
            <h2 style="margin: 0; font-size: 15px; font-weight: 650; color: #f4f3f8; display: flex; align-items: center; gap: 10px; white-space: nowrap"><span style="width: 22px; height: 22px; border-radius: 50%; background: #a78bfa; color: #1a1030; font-size: 12px; display: inline-flex; align-items: center; justify-content: center">1</span>The hand</h2>
            <div class="seg" role="group" aria-label="How to enter the hand">
              <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
                <button type="button" class="seg-item" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}">{{m.label}}</button>
              </sc-for>
            </div>
          </div>

          <sc-if value="{{isClick}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; gap: 14px">
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
                <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #8a8899">Acts first
                  <select><option>BB</option><option>SB</option></select>
                </label>
                <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #8a8899">Acts last
                  <select><option>BTN</option><option>CO</option></select>
                </label>
                <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #8a8899">Stack (bb)
                  <input type="text" value="100">
                </label>
              </div>

              <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid #2a2a34; border-radius: 10px; overflow: hidden">
                <li style="padding: 12px 14px; background: #1b1b23; display: flex; flex-direction: column; gap: 6px">
                  <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8a8899">Preflop</span>
                  <span style="display: flex; justify-content: space-between; color: #f4f3f8"><span>BTN raises to 2.5bb</span><span style="color: #8a8899">pot 4bb</span></span>
                  <span style="display: flex; justify-content: space-between; color: #f4f3f8"><span>BB calls</span><span style="color: #8a8899">pot 5.5bb</span></span>
                </li>
                <li style="padding: 12px 14px; background: rgba(167,139,250,.08); border-top: 1px solid #2a2a34; display: flex; flex-direction: column; gap: 10px">
                  <span style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #c4b5fd">Flop · BB to act</span><span style="font-size: 12px; color: #b7b5c3">Pot 5.5bb · Stacks 97.5bb</span></span>
                  <span style="color: #b7b5c3; font-size: 13px">This is the decision the solver will work out. Add an action first if you want to solve BTN's reply instead.</span>
                  <span style="display: flex; flex-wrap: wrap; gap: 6px">
                    <button type="button" class="btn btn-secondary" style="min-height: 34px; font-size: 13px">BB checks</button>
                    <button type="button" class="btn btn-secondary" style="min-height: 34px; font-size: 13px">BB bets…</button>
                  </span>
                </li>
              </ol>
            </div>
          </sc-if>

          <sc-if value="{{isPaste}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <label for="hh" style="font-size: 12px; color: #8a8899">Paste a PokerStars-style hand history. We'll fill in the players, board, pot and stacks from it.</label>
              <textarea id="hh" rows="8" style="padding: 10px 12px; font: 12px/1.5 ui-monospace, Consolas, monospace; resize: vertical">PokerStars Hand #1: Hold'em No Limit ($0.50/$1.00 USD)
Table 'Atlas' 6-max Seat #4 is the button
Seat 4: Hero ($100 in chips)
...</textarea>
              <button type="button" class="btn btn-secondary" style="align-self: flex-start">Read hand history</button>
            </div>
          </sc-if>
        </section>

        <section style="display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 15px; font-weight: 650; color: #f4f3f8; display: flex; align-items: center; gap: 10px"><span style="width: 22px; height: 22px; border-radius: 50%; background: #a78bfa; color: #1a1030; font-size: 12px; display: inline-flex; align-items: center; justify-content: center">2</span>The board</h2>
          <div style="display: flex; gap: 8px; align-items: center">
            <sc-for list="{{board}}" as="c" hint-placeholder-count="3">
              <button type="button" class="slot" aria-label="{{c.aria}}" style="background: #ffffff; color: {{c.color}}; box-shadow: 0 2px 6px rgba(0,0,0,.35)"><span>{{c.rank}}</span><span style="font-size: 18px">{{c.suit}}</span></button>
            </sc-for>
            <span aria-hidden="true" style="width: 1px; height: 48px; background: #2f2f3a; margin: 0 4px"></span>
            <button type="button" class="slot slot-empty">Turn<br>+</button>
            <button type="button" class="slot slot-empty">River<br>+</button>
          </div>
          <label style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #8a8899">Or type it
            <input type="text" value="Qs 5c 2c" style="flex: 1; min-height: 36px; font-family: ui-monospace, Consolas, monospace">
          </label>
          <p style="margin: 0; font-size: 12px; color: #8a8899">Click a card to change it. 3 cards solves the flop, 4 the turn, 5 the river.</p>
        </section>

        <section style="display: flex; flex-direction: column; gap: 14px; margin-top: auto; padding: 18px; border-radius: 12px; background: #1b1b23; border: 1px solid #2a2a34">
          <h2 style="margin: 0; font-size: 15px; font-weight: 650; color: #f4f3f8; display: flex; align-items: center; gap: 10px"><span style="width: 22px; height: 22px; border-radius: 50%; background: #a78bfa; color: #1a1030; font-size: 12px; display: inline-flex; align-items: center; justify-content: center">3</span>Ready to solve</h2>
          <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
            <li style="display: flex; gap: 8px; align-items: center; color: #f4f3f8"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#46b06a" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Hand set up: BB vs BTN, single-raised pot</li>
            <li style="display: flex; gap: 8px; align-items: center; color: #f4f3f8"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#46b06a" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Flop picked: Q♠ 5♣ 2♣</li>
            <li style="display: flex; gap: 8px; align-items: center; color: #f4f3f8"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#46b06a" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Both ranges loaded</li>
          </ul>
          <a href="solve-result.html" class="btn btn-primary" style="min-height: 48px; font-size: 15px">Solve BB's flop decision</a>
          <p style="margin: 0; font-size: 12px; color: #8a8899; text-align: center">Usually 10–90 seconds. This is a real solve, not a lookup.</p>
        </section>
      </aside>

      <!-- Canvas -->
      <section aria-label="Ranges and results" style="flex: 999 1 600px; min-width: 0; padding: 24px 32px; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #2a2a34">
          <div role="tablist" aria-label="View" style="display: flex; gap: 24px">
            <button type="button" role="tab" aria-selected="true" style="background: none; border: 0; border-bottom: 2px solid #a78bfa; padding: 0 0 12px; color: #f4f3f8; font: 600 14px/1 system-ui, 'Segoe UI', Roboto, sans-serif; cursor: pointer">Ranges</button>
            <button type="button" role="tab" aria-selected="false" disabled style="background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 0 12px; color: #8a8899; font: 500 14px/1 system-ui, 'Segoe UI', Roboto, sans-serif">Strategy · solve first</button>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 10px; background: #1b1b23; border: 1px solid #2a2a34">
          <p style="margin: 0; flex: 1 1 320px; color: #b7b5c3"><strong style="color: #f4f3f8">Ranges are the hands each player could have by now.</strong> We've loaded a standard starting point from the preflop action. Click or drag on the chart to adjust it.</p>
          <div style="display: flex; gap: 8px; flex-wrap: wrap">
            <button type="button" class="btn btn-secondary">Reload from preflop action</button>
            <button type="button" class="btn btn-ghost" disabled title="Available once a flop or turn action is recorded">Narrow by earlier action</button>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
          <!-- Big grid -->
          <div style="flex: 999 1 440px; min-width: 0; max-width: 680px; display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; gap: 10px">
              <sc-for list="{{players}}" as="p" hint-placeholder-count="2">
                <button type="button" class="ptab" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}">
                  <span style="display: block; font-weight: 650; font-size: 15px">{{p.name}}'s range</span>
                  <span style="display: block; font-size: 12px; color: #8a8899">{{p.sub}}</span>
                </button>
              </sc-for>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between">
              <div style="display: flex; align-items: center; gap: 8px">
                <span style="font-size: 12px; color: #8a8899">Paint with</span>
                <div class="seg" role="group" aria-label="Brush weight">
                  <sc-for list="{{brushes}}" as="b" hint-placeholder-count="4">
                    <button type="button" class="seg-item" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}">{{b.label}}</button>
                  </sc-for>
                </div>
              </div>
              <div style="display: flex; gap: 6px">
                <button type="button" class="btn btn-ghost" style="min-height: 34px; font-size: 13px">Suits</button>
                <button type="button" class="btn btn-ghost" style="min-height: 34px; font-size: 13px" onClick="{{resetActive}}">Reset</button>
                <button type="button" class="btn btn-ghost" style="min-height: 34px; font-size: 13px">Clear</button>
              </div>
            </div>
            <div role="grid" aria-label="{{activeName}}'s range" style="display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 3px; padding: 6px; background: #1b1b23; border-radius: 10px; border: 1px solid #2a2a34">
              <sc-for list="{{cells}}" as="cell" hint-placeholder-count="169">
                <button type="button" role="gridcell" class="cell" aria-label="{{cell.aria}}" onClick="{{cell.pick}}" style="background: {{cell.bg}}; color: {{cell.fg}}">{{cell.label}}</button>
              </sc-for>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; font-size: 13px">
              <span style="color: #f4f3f8; font-variant-numeric: tabular-nums"><strong>{{activeCombos}}</strong> combos · {{activePct}}% of all hands</span>
              <span style="display: flex; gap: 14px; color: #8a8899; font-size: 12px; align-items: center">
                <span style="display: flex; gap: 6px; align-items: center"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 3px; background: #46b06a"></span>Always</span>
                <span style="display: flex; gap: 6px; align-items: center"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 3px; background: linear-gradient(to top, #46b06a 50%, #2b2b34 50%)"></span>Sometimes (fill = how often)</span>
                <span style="display: flex; gap: 6px; align-items: center"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 3px; background: #2b2b34"></span>Never</span>
              </span>
            </div>
            <p style="margin: 0; font-size: 12px; color: #8a8899">{{activeNote}}</p>
          </div>

          <!-- Side column: both players at a glance -->
          <div style="flex: 1 1 200px; min-width: 0; max-width: 320px; display: flex; flex-direction: column; gap: 12px">
            <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8a8899">Both players</span>
            <sc-for list="{{players}}" as="p" hint-placeholder-count="2">
              <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" class="ptab" style="display: flex; flex-direction: column; gap: 10px">
                <span style="display: flex; justify-content: space-between; width: 100%"><span style="font-weight: 650; color: #f4f3f8">{{p.name}}</span><span style="font-size: 12px; font-variant-numeric: tabular-nums">{{p.pct}}%</span></span>
                <span aria-hidden="true" style="display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 1px; width: 100%">
                  <sc-for list="{{p.mini}}" as="m" hint-placeholder-count="169"><span class="mini" style="background: {{m.bg}}"></span></sc-for>
                </span>
                <span style="font-size: 12px; color: #8a8899">{{p.source}}</span>
              </button>
            </sc-for>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>
</script>
<script type="text/x-dc-logic" id="dc-logic">
var R = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
function ix(c) { return R.indexOf(c); }
function handAt(r, c) {
  if (r === c) return R[r] + R[c];
  return r < c ? R[r] + R[c] + 's' : R[c] + R[r] + 'o';
}
function buildRange(pairMin, suited, off, over) {
  var m = {};
  for (var r = 0; r < 13; r++) {
    for (var c = 0; c < 13; c++) {
      var h = handAt(r, c), w = 0;

<script>/* Tiny standalone renderer for the mockup screens: {{holes}}, <sc-for>,
