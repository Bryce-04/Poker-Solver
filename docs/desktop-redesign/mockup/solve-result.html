<script type="text/x-dc-logic" id="dc-logic">
var R = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
function ix(c) { return R.indexOf(c); }
function handAt(r, c) {
  if (r === c) return R[r] + R[c];
  return r < c ? R[r] + R[c] + 's' : R[c] + R[r] + 'o';
}
function buildRange(pairMin, suited, off, over) {
  var m = {};
  for (var r = 0; r < 13; r++) for (var c = 0; c < 13; c++) {
    var h = handAt(r, c), w = 0;
    if (r === c) w = r <= ix(pairMin) ? 1 : 0;
    else if (r < c) w = suited[R[r]] && c <= ix(suited[R[r]]) ? 1 : 0;
    else w = off[R[c]] && r <= ix(off[R[c]]) ? 1 : 0;
    if (over[h] !== undefined) w = over[h];
    if (w > 0) m[h] = w;
  }
  return m;
}
function combosOf(h) { return h.length === 2 ? 6 : (h[2] === 's' ? 4 : 12); }
var BB = buildRange('2',
  { A: '2', K: '2', Q: '4', J: '6', T: '6', '9': '6', '8': '6', '7': '5', '6': '5', '5': '4' },
  { A: '2', K: '8', Q: '9', J: '9', T: '9' },
  { AA: 0.25, KK: 0.25, QQ: 0.5, AKs: 0.25, AKo: 0.25, A5s: 0.5, A4s: 0.5 });

var ACTIONS = [
  { label: 'Check', short: 'Check', color: '#f0b93d' },
  { label: 'Bet small (25%)', short: 'Small', color: '#f0897c' },
  { label: 'Bet medium (75%)', short: 'Med', color: '#e8654f' },
  { label: 'Bet large (125%)', short: 'Large', color: '#d4483a' }
];
var CATS = {
  set: { name: 'Set: three of a kind', mix: [35, 15, 30, 20], why: 'A set is one of the best hands on this board. Betting builds the pot while BTN still has hands that will pay. Checking sometimes keeps BB’s checks from looking weak.' },
  twopair: { name: 'Two pair', mix: [40, 20, 25, 15], why: 'Very strong, but a flush could still arrive. Betting charges BTN’s draws and gets value from top pairs.' },
  overpair: { name: 'Overpair (above the queen)', mix: [45, 40, 15, 0], why: 'Ahead of almost every pair BTN can have. Small bets get called by worse hands; big bets mostly fold them out.' },
  tptk: { name: 'Top pair, strong kicker', mix: [50, 35, 15, 0], why: 'A good hand that beats most of what calls a small bet. Checking keeps BTN’s bluffs in, and some checks need strong hands so BTN can’t attack them freely.' },
  toppair: { name: 'Top pair, weaker kicker', mix: [65, 30, 5, 0], why: 'Good but easy to outkick. BB mostly checks to keep the pot small, and bets small sometimes to protect against overcards.' },
  underpair: { name: 'Pair below the queen', mix: [75, 25, 0, 0], why: 'Beats bluffs but loses to any queen. Checking keeps the pot small and lets BTN bluff.' },
  smallpair: { name: 'Small pocket pair', mix: [90, 10, 0, 0], why: 'Weak, with little room to improve. Checking is the cheap way to see what BTN does.' },
  lowpair: { name: 'Middle or bottom pair', mix: [80, 20, 0, 0], why: 'Some showdown value, but it’s hard to bet for value. Mostly check.' },
  nutdraw: { name: 'Ace high, maybe a flush draw', mix: [55, 30, 15, 0], why: 'With clubs it can make the best flush, and the ace adds outs. Betting as a semi-bluff can win the pot now or later.' },
  straightdraw: { name: 'Straight draw', mix: [60, 25, 15, 0], why: 'Not much yet, but plenty of cards improve it. That makes it a good semi-bluff some of the time.' },
  suitedair: { name: 'High cards, maybe a draw', mix: [80, 20, 0, 0], why: 'Mostly nothing yet. The club versions sometimes bet as a bluff with a draw.' },
  air: { name: 'High cards, no pair', mix: [95, 5, 0, 0], why: 'Missed completely, and it’s not a good bluff. Check and usually give up if BTN bets.' }
};
function classify(h) {
  var a = h[0], b = h[1], pair = h.length === 2, suited = h[2] === 's';
  if (pair) {
    if (a === 'Q' || a === '5' || a === '2') return 'set';
    if (a === 'A' || a === 'K') return 'overpair';
    if (ix(a) < ix('5')) return 'underpair';
    return 'smallpair';
  }
  if (a === 'Q' || b === 'Q') {
    var other = a === 'Q' ? b : a;
    if (other === '5' || other === '2') return 'twopair';
    if (other === 'A' || other === 'K') return 'tptk';
    return 'toppair';
  }
  if (a === '5' && b === '2') return 'twopair';
  if (a === '5' || b === '5' || b === '2') return 'lowpair';
  if (suited && a === 'A') return 'nutdraw';
  var draws = { A3: 1, A4: 1, '43': 1, '64': 1, '63': 1, '74': 1 };
  if (draws[a + b]) return 'straightdraw';
  if (suited) return 'suitedair';
  return 'air';
}
function gradient(mix) {
  var stops = [], at = 0;
  for (var i = 0; i < 4; i++) {
    if (!mix[i]) continue;
    stops.push(ACTIONS[i].color + ' ' + at + '% ' + (at + mix[i]) + '%');
    at += mix[i];
  }
  return stops.length === 1 ? ACTIONS[mix.indexOf(100) >= 0 ? mix.indexOf(100) : 0].color : 'linear-gradient(to right, ' + stops.join(', ') + ')';
}

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'AQo' }; }
  renderVals() {
    var self = this, sel = this.state.sel;
    var totals = [0, 0, 0, 0], mass = 0, cells = [];
    for (var r = 0; r < 13; r++) for (var c = 0; c < 13; c++) {
      (function (h) {
        var w = BB[h] || 0;
        if (w) {
          var cat = CATS[classify(h)], m = combosOf(h) * w;
          for (var i = 0; i < 4; i++) totals[i] += cat.mix[i] * m;
          mass += m;
          cells.push({ label: h, bg: gradient(cat.mix), fg: '#1a1030', opacity: String(0.4 + 0.6 * w),
            pressed: String(sel === h), pick: function () { self.setState({ sel: h }); },
            aria: h + ': ' + cat.mix.map(function (p, i) { return p ? ACTIONS[i].short + ' ' + p + '%' : null; }).filter(Boolean).join(', ') });
        } else {
          cells.push({ label: h, bg: '#1f1f27', fg: '#6c6a7a', opacity: '1', pressed: String(sel === h),
            pick: function () { self.setState({ sel: h }); }, aria: h + ': not in BB’s range' });
        }
      })(handAt(r, c));
    }
    var mix = ACTIONS.map(function (a, i) {
      var p = Math.round(totals[i] / mass);
      return { label: a.label, short: a.short + ' ' + p + '%', color: a.color, width: p + '%', pctText: p + '%', p: p };
    }).filter(function (a) { return a.p > 0; });

    var w = BB[sel] || 0, info;
    if (w) {
      var key = classify(sel), cat = CATS[key];
      var order = cat.mix.map(function (p, i) { return { p: p, i: i }; }).sort(function (x, y) { return y.p - x.p; });
      var top = ACTIONS[order[0].i].label.toLowerCase(), second = ACTIONS[order[1].i].label.toLowerCase();
      var advice = order[0].p >= 80 ? 'Almost always ' + top + '.'
        : order[0].p >= 50 ? 'Usually ' + top + ', sometimes ' + second + '. Both are fine: the solver mixes on purpose so BTN can’t read BB’s hand.'
        : 'A close mix. Any of the top plays is fine. What matters is not always doing the same thing.';
      var n = combosOf(sel) * w;
      info = {
        label: sel, category: cat.name, inRange: true, outOfRange: false,
        combos: (n % 1 ? n.toFixed(1) : n) + ' combos in BB’s range' + (w < 1 ? ' (BB usually 3-bets it instead)' : ''),
        rows: cat.mix.map(function (p, i) { return { label: ACTIONS[i].label, pctText: p + '%', width: p + '%', color: ACTIONS[i].color, p: p }; }).filter(function (x) { return x.p > 0; }),
        advice: advice, why: cat.why
      };
    } else {
      info = { label: sel, category: 'Not in BB’s range', combos: '0 combos', inRange: false, outOfRange: true, rows: [], advice: '', why: '' };
    }
    return {
      board: [
        { rank: 'Q', suit: '♠', aria: 'Queen of spades' },
        { rank: '5', suit: '♣', aria: 'Five of clubs' },
        { rank: '2', suit: '♣', aria: 'Two of clubs' }
      ],
      cells: cells, mix: mix, checkPct: mix[0].p,
      mixAria: mix.map(function (a) { return a.label + ' ' + a.pctText; }).join(', '),
      sel: info
    };
  }
}
</script>
<script>/* Tiny standalone renderer for the mockup screens: {{holes}}, <sc-for>,
   <sc-if>, onClick handlers, and a DCLogic base class with setState. */
(function () {
  var TABLE_TAGS = ['table', 'thead', 'tbody', 'tr', 'td', 'th'];
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  function lookup(path, scope) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) {
      var v = lookup(p, scope);
      return v == null ? '' : String(v);
    });
  }

  window.DCLogic = class {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(patch) {
      this.state = Object.assign({}, this.state, typeof patch === 'function' ? patch(this.state) : patch);
      this.__rerender && this.__rerender();
    }
    forceUpdate() { this.__rerender && this.__rerender(); }
  };

  function renderNode(node, scope, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = lookup(node.getAttribute('list').replace(WHOLE, '$1'), scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        node.childNodes.forEach(function (c) { renderNode(c, s, out); });
      });
      return;
    }
    if (tag === 'sc-if') {
      if (lookup(node.getAttribute('value').replace(WHOLE, '$1'), scope)) {
        node.childNodes.forEach(function (c) { renderNode(c, scope, out); });
      }
      return;
    }
    var realTag = tag.indexOf('x-') === 0 && TABLE_TAGS.indexOf(tag.slice(2)) >= 0 ? tag.slice(2) : tag;
    var el = node.namespaceURI && node.namespaceURI !== 'http://www.w3.org/1999/xhtml'
      ? document.createElementNS(node.namespaceURI, realTag)
      : document.createElement(realTag);
    Array.prototype.forEach.call(node.attributes, function (a) {
      if (a.name.indexOf('hint-') === 0) return;
      var whole = a.value.match(WHOLE);
      if (/^on[a-z]+$/i.test(a.name) && whole) {
        var fn = lookup(whole[1], scope);
        if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn);
        return;
      }
      if (whole && a.name !== 'style') {
        var v = lookup(whole[1], scope);
        if (v === false || v == null) return;
        el.setAttribute(a.name, v === true ? '' : String(v));
        return;
      }
      el.setAttribute(a.name, interp(a.value, scope));
    });
    if (realTag === 'input' && node.hasAttribute('value')) el.value = interp(node.getAttribute('value'), scope);
    node.childNodes.forEach(function (c) { renderNode(c, scope, el.childNodes && { push: function (n) { el.appendChild(n); } }); });
    out.push(el);
  }

  window.addEventListener('DOMContentLoaded', function () {
    var src = document.getElementById('dc-template').textContent;
    TABLE_TAGS.forEach(function (t) {
      src = src.replace(new RegExp('<' + t + '(?=[\\s>])', 'g'), '<x-' + t).replace(new RegExp('</' + t + '>', 'g'), '</x-' + t + '>');
    });
    var holder = document.createElement('div');
    holder.innerHTML = src;
    var Component = new Function(document.getElementById('dc-logic').textContent + '\n;return Component;')();
    var inst = new Component({});
    var root = document.getElementById('app');
    inst.__rerender = function () {
      var out = [];
      var vals = inst.renderVals ? inst.renderVals() : {};
      holder.childNodes.forEach(function (c) { renderNode(c, vals, out); });
      root.replaceChildren.apply(root, out);
    };
    inst.__rerender();
    if (inst.componentDidMount) inst.componentDidMount();
  });
})();
</script>
