<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Library — saved spots</title>
<!-- Design mockup for docs/desktop-redesign.md. Reference only: do not ship.
     Data shown (ranges, strategy %, saved spots) is placeholder. -->
<style>
body{margin:0;background:#131318}
a{color:#c4b5fd}a:hover{color:#ddd6fe}
.nav{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:8px;text-decoration:none;color:#b7b5c3}
.nav:hover{background:#22222b;color:#f4f3f8}
.nav[aria-current=page]{background:rgba(167,139,250,.14);color:#f4f3f8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:8px;font:600 14px/1.3 system-ui,'Segoe UI',Roboto,sans-serif;cursor:pointer;text-decoration:none;border:1px solid transparent;box-sizing:border-box}
.btn-primary{background:#a78bfa;color:#1a1030}
.btn-primary:hover{background:#c4b5fd;color:#1a1030}
.btn-secondary{background:#24242e;color:#f4f3f8;border-color:#43424f}
.btn-secondary:hover{background:#2c2c38;color:#f4f3f8}
.btn-ghost{background:transparent;color:#b7b5c3}
.btn-ghost:hover{background:#22222b;color:#f4f3f8}
.btn-danger{background:transparent;color:#f0857a}
.btn-danger:hover{background:rgba(240,133,122,.12);color:#f0857a}
.icon-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:0;background:transparent;color:#8a8899;cursor:pointer}
.icon-btn:hover{background:#2c2c38;color:#f4f3f8}
.seg{display:inline-flex;padding:3px;gap:2px;background:#131318;border:1px solid #2f2f3a;border-radius:9px}
.seg-item{min-height:34px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:#b7b5c3;font:550 13px/1 system-ui,'Segoe UI',Roboto,sans-serif;cursor:pointer}
.seg-item:hover{color:#f4f3f8}
.seg-item[aria-pressed=true]{background:#2c2c38;color:#f4f3f8;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.rowname{background:none;border:0;padding:0;color:#f4f3f8;font:600 14px/1.4 system-ui,'Segoe UI',Roboto,sans-serif;cursor:pointer;text-align:left}
.rowname:hover{color:#c4b5fd}
.mini{aspect-ratio:1/1;min-width:0;border-radius:1px}
th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8a8899;text-align:left;padding:10px 12px;border-bottom:1px solid #2a2a34;white-space:nowrap}
td{padding:12px;border-bottom:1px solid #22222b;vertical-align:middle;white-space:nowrap}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #a78bfa;outline-offset:2px}
input{font:inherit;color:#f4f3f8;background:#131318;border:1px solid #43424f;border-radius:8px;padding:0 12px;min-height:40px;box-sizing:border-box}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="dc-template">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #131318; color: #b7b5c3; font: 14px/1.5 system-ui, 'Segoe UI', Roboto, sans-serif">

  <nav aria-label="Main" style="flex: 1 1 232px; box-sizing: border-box; background: #17171e; border-right: 1px solid #2a2a34; padding: 20px 14px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2 4 14h6.5L9 22l11-13h-6.5L14 2z" fill="#a78bfa"></path></svg>
      <span style="font-size: 17px; font-weight: 700; color: #f4f3f8; letter-spacing: -0.01em">Poker Solver</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <a class="nav" href="solve-setup.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="margin-top: 2px; flex: none"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
        <span style="display: flex; flex-direction: column"><span style="font-weight: 600">Solve</span><span style="font-size: 12px; color: #8a8899">Best play after the flop</span></span>
      </a>
      <a class="nav" href="ranges.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="margin-top: 2px; flex: none"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
        <span style="display: flex; flex-direction: column"><span style="font-weight: 600">Ranges</span><span style="font-size: 12px; color: #8a8899">Which hands to play preflop</span></span>
      </a>
      <a class="nav" href="library.html" aria-current="page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px; flex: none"><path d="M6 3h12v18l-6-4-6 4V3z"></path></svg>
        <span style="display: flex; flex-direction: column"><span style="font-weight: 600">Library</span><span style="font-size: 12px; color: #8a8899">Your saved spots</span></span>
      </a>
      <a class="nav" href="#drill">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px; flex: none"><rect x="3" y="6" width="11" height="15" rx="2"></rect><path d="M9 3h10a2 2 0 0 1 2 2v12"></path></svg>
        <span style="display: flex; flex-direction: column"><span style="font-weight: 600">Drill</span><span style="font-size: 12px; color: #8a8899">Practice game · full screen</span></span>
      </a>
    </div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
      <a href="#guide" style="display: block; text-decoration: none; padding: 14px; border-radius: 10px; background: #1f1d2b; border: 1px solid #34304a">
        <span style="display: block; color: #f4f3f8; font-weight: 600; font-size: 13px">New to solvers?</span>
        <span style="display: block; color: #b7b5c3; font-size: 12px; margin-top: 2px">A 2-minute guide to reading the charts</span>
      </a>
      <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
        <span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 50%; background: #2c2c38; color: #f4f3f8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none">P</span>
        <span style="flex: 1; min-width: 0; font-size: 12px; color: #b7b5c3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">peyt0303@gmail.com</span>
        <button type="button" class="btn btn-ghost" style="min-height: 32px; padding: 0 8px; font-size: 12px">Sign out</button>
      </div>
    </div>
  </nav>

  <main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 22px 32px; border-bottom: 1px solid #2a2a34">
      <div>
        <h1 style="margin: 0; font-size: 22px; font-weight: 700; color: #f4f3f8; letter-spacing: -0.01em">Library</h1>
        <p style="margin: 2px 0 0; color: #8a8899">Spots you've saved. Only you can see them.</p>
      </div>
      <div style="display: flex; gap: 8px">
        <a href="ranges.html" class="btn btn-secondary">New preflop chart</a>
        <a href="solve-setup.html" class="btn btn-primary">New solve</a>
      </div>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px 32px; align-items: flex-start">
      <section aria-label="Saved spots" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
          <label style="display: flex; align-items: center; gap: 8px; flex: 1 1 260px; max-width: 360px">
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search saved spots</span>
            <input type="text" placeholder="Search by name, seat or board" style="flex: 1">
          </label>
          <div class="seg" role="group" aria-label="Filter by type">
            <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
              <button type="button" class="seg-item" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}">{{f.label}}</button>
            </sc-for>
          </div>
        </div>

        <div style="overflow-x: auto; border: 1px solid #2a2a34; border-radius: 12px; background: #1b1b23">
          <table style="width: 100%; border-collapse: collapse; font-size: 13px">
            <thead>
              <tr><th>Name</th><th>Type</th><th>Players</th><th>Stack</th><th>Board</th><th>Saved</th><th><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th></tr>
            </thead>
            <tbody>
              <sc-for list="{{rows}}" as="row" hint-placeholder-count="5">
                <tr style="background: {{row.bg}}">
                  <td style="box-shadow: {{row.mark}}"><button type="button" class="rowname" onClick="{{row.pick}}">{{row.name}}</button></td>
                  <td><span style="display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{row.typeBg}}; color: {{row.typeFg}}">{{row.type}}</span></td>
                  <td style="color: #f4f3f8">{{row.players}}</td>
                  <td style="font-variant-numeric: tabular-nums">{{row.stack}}</td>
                  <td style="color: #f4f3f8; letter-spacing: 0.02em">{{row.board}}</td>
                  <td>{{row.saved}}</td>
                  <td style="text-align: right">
                    <a href="{{row.href}}" style="font-weight: 600; margin-right: 6px">Open</a>
                    <button type="button" class="icon-btn" aria-label="Rename {{row.name}}" title="Rename"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg></button>
                    <button type="button" class="icon-btn" aria-label="Delete {{row.name}}" title="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
                  </td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
        <p style="margin: 0; font-size: 12px; color: #8a8899">Tip: save a chart from Ranges or a setup from Solve, and it shows up here.</p>
      </section>

      <aside aria-label="Selected spot" style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: 12px; background: #1b1b23; border: 1px solid #2a2a34">
        <div>
          <span style="display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{sel.typeBg}}; color: {{sel.typeFg}}">{{sel.type}}</span>
          <h2 style="margin: 8px 0 0; font-size: 18px; font-weight: 700; color: #f4f3f8">{{sel.name}}</h2>
          <p style="margin: 2px 0 0; font-size: 13px">{{sel.desc}}</p>
        </div>
        <sc-if value="{{sel.isPre}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span aria-hidden="true" style="display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px">
              <sc-for list="{{sel.mini}}" as="m" hint-placeholder-count="169"><span class="mini" style="background: {{m.bg}}"></span></sc-for>
            </span>
            <span style="font-size: 13px; color: #f4f3f8; font-variant-numeric: tabular-nums">{{sel.pct}}% of hands · {{sel.combos}} combos</span>
          </div>
        </sc-if>
        <sc-if value="{{sel.isPost}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; gap: 6px">
              <sc-for list="{{board}}" as="c" hint-placeholder-count="3">
                <span role="img" aria-label="{{c.aria}}" style="width: 40px; height: 56px; border-radius: 6px; background: #ffffff; color: #141319; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 700 16px/1 system-ui, 'Segoe UI', Roboto, sans-serif"><span>{{c.rank}}</span><span style="font-size: 14px">{{c.suit}}</span></span>
              </sc-for>
            </div>
            <p style="margin: 0; padding: 10px 12px; border-radius: 8px; background: #24242e; font-size: 12px">This saves the setup: hand, board and ranges. Solve results aren't saved yet. Open it and press Solve to see the strategy again.</p>
          </div>
        </sc-if>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <a href="{{sel.href}}" class="btn btn-primary">{{sel.openLabel}}</a>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
            <button type="button" class="btn btn-ghost" style="padding: 0 8px; font-size: 13px">Duplicate</button>
            <button type="button" class="btn btn-ghost" style="padding: 0 8px; font-size: 13px">Rename</button>
            <button type="button" class="btn btn-danger" style="padding: 0 8px; font-size: 13px">Delete</button>
          </div>
        </div>
      </aside>
    </div>
  </main>
</div>
</script>
<script type="text/x-dc-logic" id="dc-logic">
var R = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
function ix(c) { return R.indexOf(c); }
function handAt(r, c) {
  if (r === c) return R[r] + R[c];
  return r < c ? R[r] + R[c] + 's' : R[c] + R[r] + 'o';
}
function buildRange(pairMin, suited, off, over) {
  var m = {};
  for (var r = 0; r < 13; r++) for (var c = 0; c < 13; c++) {
    var h = handAt(r, c), w = 0;
    if (r === c) w = r <= ix(pairMin) ? 1 : 0;
    else if (r < c) w = suited[R[r]] && c <= ix(suited[R[r]]) ? 1 : 0;
    else w = off[R[c]] && r <= ix(off[R[c]]) ? 1 : 0;
    if (over && over[h] !== undefined) w = over[h];
    if (w > 0) m[h] = w;
  }
  return m;
}
function combosOf(h) { return h.length === 2 ? 6 : (h[2] === 's' ? 4 : 12); }
function bgFor(w) {
  if (!w) return '#2b2b34';
  if (w >= 1) return '#46b06a';
  var p = Math.round(w * 100);
  return 'linear-gradient(to top, #46b06a ' + p + '%, #33333d ' + p + '%)';
}
var BTN_S = { A: '2', K: '2', Q: '5', J: '7', T: '6', '9': '6', '8': '6', '7': '5', '6': '5', '5': '4' };
var SPOTS = [
  { name: 'BTN open · standard', type: 'Preflop', players: 'BTN', stack: '100bb', board: '—', saved: 'Oct 7, 3:49 PM',
    desc: 'BTN opening range, nobody raised yet. Unedited standard chart.',
    range: buildRange('2', BTN_S, { A: '2', K: '7', Q: '9', J: 'T' }) },
  { name: 'BTN open · my version', type: 'Preflop', players: 'BTN', stack: '100bb', board: '—', saved: 'Oct 7, 3:37 PM',
    desc: 'BTN opening range, tightened: weak offsuit kings and some suited gappers removed.',
    range: buildRange('2', { A: '2', K: '5', Q: '7', J: '8', T: '7', '9': '7', '8': '7', '7': '6', '6': '5', '5': '4' }, { A: '5', K: '9', Q: 'T', J: 'T' }) },
  { name: 'BB vs CO raise', type: 'Preflop', players: 'BB', stack: '100bb', board: '—', saved: 'Oct 12, 8:10 PM',
    desc: 'BB continuing range after a CO open.',
    range: buildRange('2', { A: '2', K: '4', Q: '6', J: '7', T: '7', '9': '7', '8': '6', '7': '5', '6': '5', '5': '4' }, { A: '7', K: '9', Q: 'T', J: 'T' }, { AA: 0.25, KK: 0.25, AKs: 0.25 }) },
  { name: 'CO open · short stack', type: 'Preflop', players: 'CO', stack: '40bb', board: '—', saved: 'Oct 14, 6:02 PM',
    desc: 'CO opening range at about 40bb.',
    range: buildRange('2', { A: '2', K: '6', Q: '8', J: '8', T: '8', '9': '8', '8': '7', '7': '6' }, { A: '8', K: 'T', Q: 'J' }) },
  { name: 'BB vs BTN on Q♠ 5♣ 2♣', type: 'Postflop', players: 'BB vs BTN', stack: '97.5bb', board: 'Q♠ 5♣ 2♣', saved: 'Oct 19, 9:41 PM',
    desc: 'Single-raised pot. BTN opened, BB called. BB to act on the flop.', range: null }
];

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 0, filter: 'all' }; }
  renderVals() {
    var self = this, st = this.state;
    var rows = [];
    SPOTS.forEach(function (s, i) {
      if (st.filter !== 'all' && s.type.toLowerCase() !== st.filter) return;
      var on = st.sel === i, pre = s.type === 'Preflop';
      rows.push({ name: s.name, type: s.type, players: s.players, stack: s.stack, board: s.board, saved: s.saved,
        bg: on ? 'rgba(167,139,250,.1)' : 'transparent', mark: on ? 'inset 3px 0 0 #a78bfa' : 'none',
        typeBg: pre ? 'rgba(70,176,106,.15)' : 'rgba(240,185,61,.15)', typeFg: pre ? '#7fd39b' : '#f0c766',
        href: pre ? 'Ranges.dc.html' : 'SolveResult.dc.html',
        pick: function () { self.setState({ sel: i }); } });
    });
    var s = SPOTS[st.sel], pre = s.type === 'Preflop', mini = [], n = 0;
    if (pre) {
      for (var r = 0; r < 13; r++) for (var c = 0; c < 13; c++) mini.push({ bg: bgFor(s.range[handAt(r, c)] || 0) });
      for (var h in s.range) n += combosOf(h) * s.range[h];
    }
    return {
      filters: [['all', 'All'], ['preflop', 'Preflop'], ['postflop', 'Postflop']].map(function (f) {
        return { label: f[1], pressed: String(st.filter === f[0]), pick: function () { self.setState({ filter: f[0] }); } };
      }),
      rows: rows,
      board: [
        { rank: 'Q', suit: '♠', aria: 'Queen of spades' },
        { rank: '5', suit: '♣', aria: 'Five of clubs' },
        { rank: '2', suit: '♣', aria: 'Two of clubs' }
      ],
      sel: {
        name: s.name, type: s.type, desc: s.desc + ' ' + s.stack + ' · saved ' + s.saved + '.',
        isPre: pre, isPost: !pre, mini: mini, pct: (n / 1326 * 100).toFixed(1), combos: Math.round(n),
        typeBg: pre ? 'rgba(70,176,106,.15)' : 'rgba(240,185,61,.15)', typeFg: pre ? '#7fd39b' : '#f0c766',
        href: pre ? 'Ranges.dc.html' : 'SolveResult.dc.html',
        openLabel: pre ? 'Open in Ranges' : 'Open in Solve'
      }
    };
  }
}
</script>
<script>/* Tiny standalone renderer for the mockup screens: {{holes}}, <sc-for>,
   <sc-if>, onClick handlers, and a DCLogic base class with setState. */
(function () {
  var TABLE_TAGS = ['table', 'thead', 'tbody', 'tr', 'td', 'th'];
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  function lookup(path, scope) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) {
      var v = lookup(p, scope);
      return v == null ? '' : String(v);
    });
  }

  window.DCLogic = class {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(patch) {
      this.state = Object.assign({}, this.state, typeof patch === 'function' ? patch(this.state) : patch);
      this.__rerender && this.__rerender();
    }
    forceUpdate() { this.__rerender && this.__rerender(); }
  };

  function renderNode(node, scope, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = lookup(node.getAttribute('list').replace(WHOLE, '$1'), scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        node.childNodes.forEach(function (c) { renderNode(c, s, out); });
      });
      return;
    }
    if (tag === 'sc-if') {
      if (lookup(node.getAttribute('value').replace(WHOLE, '$1'), scope)) {
        node.childNodes.forEach(function (c) { renderNode(c, scope, out); });
      }
      return;
    }
    var realTag = tag.indexOf('x-') === 0 && TABLE_TAGS.indexOf(tag.slice(2)) >= 0 ? tag.slice(2) : tag;
    var el = node.namespaceURI && node.namespaceURI !== 'http://www.w3.org/1999/xhtml'
      ? document.createElementNS(node.namespaceURI, realTag)
      : document.createElement(realTag);
    Array.prototype.forEach.call(node.attributes, function (a) {
      if (a.name.indexOf('hint-') === 0) return;
      var whole = a.value.match(WHOLE);
      if (/^on[a-z]+$/i.test(a.name) && whole) {
        var fn = lookup(whole[1], scope);
        if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn);
        return;
      }
      if (whole && a.name !== 'style') {
        var v = lookup(whole[1], scope);
        if (v === false || v == null) return;
        el.setAttribute(a.name, v === true ? '' : String(v));
        return;
      }
      el.setAttribute(a.name, interp(a.value, scope));
    });
    if (realTag === 'input' && node.hasAttribute('value')) el.value = interp(node.getAttribute('value'), scope);
    node.childNodes.forEach(function (c) { renderNode(c, scope, el.childNodes && { push: function (n) { el.appendChild(n); } }); });
    out.push(el);
  }

  window.addEventListener('DOMContentLoaded', function () {
    var src = document.getElementById('dc-template').textContent;
    TABLE_TAGS.forEach(function (t) {
      src = src.replace(new RegExp('<' + t + '(?=[\\s>])', 'g'), '<x-' + t).replace(new RegExp('</' + t + '>', 'g'), '</x-' + t + '>');
    });
    var holder = document.createElement('div');
    holder.innerHTML = src;
    var Component = new Function(document.getElementById('dc-logic').textContent + '\n;return Component;')();
    var inst = new Component({});
    var root = document.getElementById('app');
    inst.__rerender = function () {
      var out = [];
      var vals = inst.renderVals ? inst.renderVals() : {};
      holder.childNodes.forEach(function (c) { renderNode(c, vals, out); });
      root.replaceChildren.apply(root, out);
    };
    inst.__rerender();
    if (inst.componentDidMount) inst.componentDidMount();
  });
})();
</script>
</body>
</html>
