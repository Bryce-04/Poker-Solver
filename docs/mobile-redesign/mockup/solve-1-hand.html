<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Solve 1 · The hand</title>
<!-- Design mockup for docs/mobile-redesign.md. Reference only: do not ship.
     Data shown (ranges, strategy %, saved spots) is placeholder. -->
<style>
body{margin:0;background:#0d0d11}
a{color:#c4b5fd}a:hover{color:#ddd6fe}
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px 0 16px;background:#17171e;border-bottom:1px solid #2a2a34}
.ttl{flex:1;font-size:18px;font-weight:700;color:#f4f3f8;letter-spacing:-.01em}
.iconbtn{width:44px;height:44px;border:0;border-radius:22px;background:transparent;color:#b7b5c3;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;font:inherit}
.iconbtn:hover{background:#24242e;color:#f4f3f8}
.avatar{width:30px;height:30px;border-radius:50%;background:#2c2c38;color:#f4f3f8;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.tabbar{height:64px;flex:none;display:flex;background:#17171e;border-top:1px solid #2a2a34}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#8a8899;text-decoration:none}
.tab:hover{color:#f4f3f8}
.tab[aria-current=page]{color:#c4b5fd}
.actionbar{flex:none;display:flex;gap:10px;padding:10px 16px;background:#131318;border-top:1px solid #2a2a34}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 18px;border-radius:12px;font:650 15px/1.25 system-ui,'Segoe UI',Roboto,sans-serif;cursor:pointer;text-decoration:none;border:1px solid transparent;box-sizing:border-box}
.btn-primary{background:#a78bfa;color:#1a1030}
.btn-primary:hover{background:#c4b5fd;color:#1a1030}
.btn-secondary{background:#24242e;color:#f4f3f8;border-color:#43424f}
.btn-secondary:hover{background:#2c2c38;color:#f4f3f8}
.btn-ghost{background:transparent;color:#b7b5c3}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.chip{min-height:44px;padding:0 6px;border-radius:12px;border:1px solid #34343f;background:#1b1b23;color:#f4f3f8;font:600 14px/1 system-ui,'Segoe UI',Roboto,sans-serif;cursor:pointer}
.chip:hover{border-color:#55546a}
.chip[aria-pressed=true]{background:rgba(167,139,250,.18);border-color:#a78bfa;color:#f4f3f8}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8a8899}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
.sheet{background:#1b1b23;border-radius:20px 20px 0 0;padding:8px 16px 20px;border-top:1px solid #34343f;display:flex;flex-direction:column;gap:14px}
.handle{width:40px;height:4px;border-radius:2px;background:#55546a;margin:4px auto 0}
button:focus-visible,a:focus-visible{outline:2px solid #a78bfa;outline-offset:2px}
</style>
</head>
<body>
<div id="app" style="width:390px;margin:0 auto"></div>
<script type="text/x-template" id="dc-template">

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #131318; color: #b7b5c3; font: 15px/1.45 system-ui, 'Segoe UI', Roboto, sans-serif">

  <header class="topbar">
    <span class="ttl">Solve</span>
    <button type="button" class="iconbtn" aria-label="Start over"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"></path></svg></button>
    <a href="account.html" class="iconbtn" aria-label="Account"><span class="avatar">P</span></a>
  </header>

  <nav aria-label="Solve steps" style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 12px 16px 10px; background: #131318">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
      <a href="{{s.href}}" aria-current="{{s.current}}" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: {{s.color}}; font-size: 12px; font-weight: 600">
        <span aria-hidden="true" style="height: 4px; border-radius: 2px; background: {{s.bar}}"></span>{{s.label}}
      </a>
    </sc-for>
  </nav>

  <main style="flex: 1; overflow-y: auto; padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 20px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 700; color: #f4f3f8; letter-spacing: -0.01em">Who's in the hand?</h1>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <span class="label" id="p1">Player 1</span>
      <div role="group" aria-labelledby="p1" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{seats1}}" as="c" hint-placeholder-count="6"><button type="button" class="chip" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
      </div>
      <span class="label" id="p2" style="margin-top: 6px">Player 2</span>
      <div role="group" aria-labelledby="p2" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{seats2}}" as="c" hint-placeholder-count="6"><button type="button" class="chip" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
      </div>
      <p style="margin: 2px 0 0; font-size: 13px">{{orderNote}}</p>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <span class="label" id="stk">Starting stack</span>
      <div role="group" aria-labelledby="stk" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{stacks}}" as="c" hint-placeholder-count="5"><button type="button" class="chip" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <span class="label">Before the flop</span>
      <ol style="list-style: none; margin: 0; padding: 0; border: 1px solid #2a2a34; border-radius: 14px; overflow: hidden; background: #1b1b23">
        <sc-for list="{{actions}}" as="a" hint-placeholder-count="1">
          <li style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid #2a2a34; color: #f4f3f8"><span><strong>{{a.who}}</strong> {{a.text}}</span><span style="font-size: 13px; color: #8a8899">pot {{a.pot}}</span></li>
        </sc-for>
        <sc-if value="{{toAct}}" hint-placeholder-val="{{ true }}">
          <li style="padding: 14px; background: rgba(167,139,250,.08); display: flex; flex-direction: column; gap: 10px">
            <span style="color: #f4f3f8; font-weight: 650">{{actorLine}}</span>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
              <sc-for list="{{buttons}}" as="b" hint-placeholder-count="4"><button type="button" class="btn btn-secondary" onClick="{{b.pick}}">{{b.label}}</button></sc-for>
            </div>
          </li>
        </sc-if>
        <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
          <li style="padding: 14px; display: flex; gap: 10px; align-items: center; color: #f4f3f8"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#46b06a" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Preflop done · pot {{pot}} · stacks {{left}}</li>
        </sc-if>
        <sc-if value="{{folded}}" hint-placeholder-val="{{ false }}">
          <li style="padding: 14px; color: #f0c766; font-size: 14px">Someone folded, so there's nothing left to solve. Undo to change it.</li>
        </sc-if>
      </ol>
      <button type="button" class="btn btn-ghost" style="align-self: flex-start; min-height: 40px; padding: 0 8px; font-size: 14px" onClick="{{undo}}">Undo last action</button>
      <button type="button" class="btn btn-ghost" style="align-self: flex-start; min-height: 40px; padding: 0 8px; font-size: 14px; color: #c4b5fd">Or paste a hand history instead</button>
    </section>
  </main>

  <div class="actionbar">
    <button type="button" class="btn btn-secondary" disabled style="flex: 0 0 96px">Back</button>
    <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
      <a href="solve-2-board.html" class="btn btn-primary" style="flex: 1">Next: the board</a>
    </sc-if>
    <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
      <button type="button" class="btn btn-primary" aria-disabled="true" style="flex: 1">Finish preflop first</button>
    </sc-if>
  </div>

  <nav class="tabbar" aria-label="Main">
    <a class="tab" href="solve-1-hand.html" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>Solve</a>
    <a class="tab" href="ranges.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>Ranges</a>
    <a class="tab" href="library.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4V3z"></path></svg>Library</a>
    <a class="tab" href="#drill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="11" height="15" rx="2"></rect><path d="M9 3h10a2 2 0 0 1 2 2v12"></path></svg>Drill</a>
  </nav>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
    <div class="scrim">
      <section class="sheet" role="dialog" aria-label="Raise size">
        <span class="handle" aria-hidden="true"></span>
        <h2 style="margin: 0; font-size: 18px; color: #f4f3f8">{{raiseTitle}}</h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{presets}}" as="p" hint-placeholder-count="4">
            <button type="button" class="chip" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><span>{{p.label}}</span><span style="font-size: 12px; color: #8a8899; font-weight: 500">{{p.sub}}</span></button>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 6px 0">
          <button type="button" class="iconbtn" aria-label="Smaller" onClick="{{minus}}" style="border: 1px solid #43424f"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
          <span style="flex: 1; text-align: center; font-size: 26px; font-weight: 750; color: #f4f3f8; font-variant-numeric: tabular-nums">{{raiseTo}}bb</span>
          <button type="button" class="iconbtn" aria-label="Bigger" onClick="{{plus}}" style="border: 1px solid #43424f"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        </div>
        <div style="display: flex; gap: 10px">
          <button type="button" class="btn btn-secondary" onClick="{{closeSheet}}" style="flex: 0 0 110px">Cancel</button>
          <button type="button" class="btn btn-primary" onClick="{{confirmRaise}}" style="flex: 1">{{raiseConfirm}}</button>
        </div>
      </section>
    </div>
  </sc-if>
</div>
</script>
<script type="text/x-dc-logic" id="dc-logic">
var SEATS = ['UTG', 'HJ', 'CO', 'BTN', 'SB', 'BB'];
var POSTFLOP = ['SB', 'BB', 'UTG', 'HJ', 'CO', 'BTN'];
function fmt(n) { return (Math.round(n * 10) / 10) + 'bb'; }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { p1: 'BB', p2: 'BTN', stack: 100, log: [], sheet: false, raiseTo: 9 };
  }
  // Rebuild the preflop situation from the log of BB/BTN decisions after BTN's open.
  sim() {
    var st = this.state, opener = st.p2, other = st.p1;
    var acts = [{ who: opener, text: 'raises to 2.5bb', pot: '4bb' }];
    var put = {}; put[opener] = 2.5; put[other] = 1;
    var actor = other, facing = 2.5, done = false, folded = false;
    st.log.forEach(function (e) {
      if (e.kind === 'fold') { acts.push({ who: actor, text: 'folds', pot: fmt(put[opener] + put[other] + 0.5) }); folded = true; }
      else if (e.kind === 'call') { put[actor] = facing; acts.push({ who: actor, text: 'calls', pot: fmt(put[opener] + put[other] + 0.5) }); done = true; }
      else { put[actor] = e.to; facing = e.to; acts.push({ who: actor, text: (e.allin ? 'goes all-in for ' : (acts.length === 1 ? '3-bets to ' : '4-bets to ')) + fmt(e.to), pot: fmt(put[opener] + put[other] + 0.5) }); actor = actor === other ? opener : other; }
    });
    return { acts: acts, actor: actor, facing: facing, put: put, done: done, folded: folded, pot: put[opener] + put[other] + 0.5 };
  }
  renderVals() {
    var self = this, st = this.state, s = this.sim();
    var toCall = s.facing - s.put[s.actor];
    var first = POSTFLOP.indexOf(st.p1) < POSTFLOP.indexOf(st.p2) ? st.p1 : st.p2;
    var last = first === st.p1 ? st.p2 : st.p1;
    var raises = s.acts.length - 1;
    var raiseWord = raises === 0 ? '3-bet' : '4-bet';
    function seatChips(key, otherKey) {
      return SEATS.map(function (p) {
        return { label: p, pressed: String(st[key] === p),
          pick: function () { if (p === st[otherKey]) return; var o = {}; o[key] = p; o.log = []; self.setState(o); } };
      });
    }
    var presets = [3, 3.5, 4].map(function (m) {
      var to = Math.round(s.facing * m * 2) / 2;
      return { label: fmt(to), sub: m + '× the raise', pressed: String(st.raiseTo === to), pick: function () { self.setState({ raiseTo: to }); } };
    });
    presets.push({ label: 'All-in', sub: st.stack + 'bb', pressed: String(st.raiseTo === st.stack), pick: function () { self.setState({ raiseTo: st.stack }); } });
    return {
      steps: [['Hand', 'Main'], ['Board', 'Board'], ['Ranges', 'RangesStep'], ['Solve', 'Ready']].map(function (x, i) {
        return { label: x[0], href: x[1] + '.dc.html', current: i === 0 ? 'step' : 'false',
          bar: i === 0 ? '#a78bfa' : '#2c2c38', color: i === 0 ? '#f4f3f8' : '#8a8899' };
      }),
      seats1: seatChips('p1', 'p2'), seats2: seatChips('p2', 'p1'),
      orderNote: first + ' acts first after the flop. ' + last + ' acts last.',
      stacks: [40, 60, 100, 150, 200].map(function (n) {
        return { label: n + 'bb', pressed: String(st.stack === n), pick: function () { self.setState({ stack: n, log: [] }); } };
      }),
      actions: s.acts,
      toAct: !s.done && !s.folded, done: s.done, notDone: !s.done, folded: s.folded,
      actorLine: s.actor + ' to act · facing ' + fmt(s.facing),
      buttons: [
        { label: 'Fold', pick: function () { self.setState({ log: st.log.concat([{ kind: 'fold' }]) }); } },
        { label: 'Call ' + fmt(toCall), pick: function () { self.setState({ log: st.log.concat([{ kind: 'call' }]) }); } },
        { label: raiseWord + '…', pick: function () { self.setState({ sheet: true, raiseTo: Math.round(s.facing * 3.5 * 2) / 2 }); } },
        { label: 'All-in', pick: function () { self.setState({ log: st.log.concat([{ kind: 'raise', to: st.stack, allin: true }]) }); } }
      ],
      pot: fmt(s.pot), left: fmt(st.stack - s.facing),
      undo: function () { self.setState({ log: st.log.slice(0, -1) }); },
      sheet: st.sheet,
      raiseTitle: s.actor + ' ' + raiseWord + 's to…',
      presets: presets, raiseTo: st.raiseTo,
      raiseConfirm: raiseWord + ' to ' + fmt(st.raiseTo),
      minus: function () { self.setState({ raiseTo: Math.max(s.facing + 1, st.raiseTo - 0.5) }); },
      plus: function () { self.setState({ raiseTo: Math.min(st.stack, st.raiseTo + 0.5) }); },
      closeSheet: function () { self.setState({ sheet: false }); },
      confirmRaise: function () { self.setState({ sheet: false, log: st.log.concat([{ kind: 'raise', to: st.raiseTo, allin: st.raiseTo >= st.stack }]) }); }
    };
  }
}
</script>
<script>/* Tiny standalone renderer for the mockup screens: {{holes}}, <sc-for>,
   <sc-if>, onClick handlers, and a DCLogic base class with setState. */
(function () {
  var TABLE_TAGS = ['table', 'thead', 'tbody', 'tr', 'td', 'th'];
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  function lookup(path, scope) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) {
      var v = lookup(p, scope);
      return v == null ? '' : String(v);
    });
  }

  window.DCLogic = class {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(patch) {
      this.state = Object.assign({}, this.state, typeof patch === 'function' ? patch(this.state) : patch);
      this.__rerender && this.__rerender();
    }
    forceUpdate() { this.__rerender && this.__rerender(); }
  };

  function renderNode(node, scope, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = lookup(node.getAttribute('list').replace(WHOLE, '$1'), scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        node.childNodes.forEach(function (c) { renderNode(c, s, out); });
      });
      return;
    }
    if (tag === 'sc-if') {
      if (lookup(node.getAttribute('value').replace(WHOLE, '$1'), scope)) {
        node.childNodes.forEach(function (c) { renderNode(c, scope, out); });
      }
      return;
    }
    var realTag = tag.indexOf('x-') === 0 && TABLE_TAGS.indexOf(tag.slice(2)) >= 0 ? tag.slice(2) : tag;
    var el = node.namespaceURI && node.namespaceURI !== 'http://www.w3.org/1999/xhtml'
      ? document.createElementNS(node.namespaceURI, realTag)
      : document.createElement(realTag);
    Array.prototype.forEach.call(node.attributes, function (a) {
      if (a.name.indexOf('hint-') === 0) return;
      var whole = a.value.match(WHOLE);
      if (/^on[a-z]+$/i.test(a.name) && whole) {
        var fn = lookup(whole[1], scope);
        if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn);
        return;
      }
      if (whole && a.name !== 'style') {
        var v = lookup(whole[1], scope);
        if (v === false || v == null) return;
        el.setAttribute(a.name, v === true ? '' : String(v));
        return;
      }
      el.setAttribute(a.name, interp(a.value, scope));
    });
    if (realTag === 'input' && node.hasAttribute('value')) el.value = interp(node.getAttribute('value'), scope);
    node.childNodes.forEach(function (c) { renderNode(c, scope, el.childNodes && { push: function (n) { el.appendChild(n); } }); });
    out.push(el);
  }

  window.addEventListener('DOMContentLoaded', function () {
    var src = document.getElementById('dc-template').textContent;
    TABLE_TAGS.forEach(function (t) {
      src = src.replace(new RegExp('<' + t + '(?=[\\s>])', 'g'), '<x-' + t).replace(new RegExp('</' + t + '>', 'g'), '</x-' + t + '>');
    });
    var holder = document.createElement('div');
    holder.innerHTML = src;
    var Component = new Function(document.getElementById('dc-logic').textContent + '\n;return Component;')();
    var inst = new Component({});
    var root = document.getElementById('app');
    inst.__rerender = function () {
      var out = [];
      var vals = inst.renderVals ? inst.renderVals() : {};
      holder.childNodes.forEach(function (c) { renderNode(c, vals, out); });
      root.replaceChildren.apply(root, out);
    };
    inst.__rerender();
    if (inst.componentDidMount) inst.componentDidMount();
  });
})();
</script>
</body>
</html>
