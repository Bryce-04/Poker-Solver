<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Ranges tab</title>
<!-- Design mockup for docs/mobile-redesign.md. Reference only: do not ship.
     Data shown (ranges, strategy %, saved spots) is placeholder. -->
<style>
body{margin:0;background:#0d0d11}
a{color:#c4b5fd}a:hover{color:#ddd6fe}
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px 0 16px;background:#17171e;border-bottom:1px solid #2a2a34}
.ttl{flex:1;font-size:18px;font-weight:700;color:#f4f3f8;letter-spacing:-.01em}
.iconbtn{width:44px;height:44px;border:0;border-radius:22px;background:transparent;color:#b7b5c3;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;font:inherit;flex:none}
.iconbtn:hover{background:#24242e;color:#f4f3f8}
.avatar{width:30px;height:30px;border-radius:50%;background:#2c2c38;color:#f4f3f8;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.tabbar{height:64px;flex:none;display:flex;background:#17171e;border-top:1px solid #2a2a34}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#8a8899;text-decoration:none}
.tab:hover{color:#f4f3f8}
.tab[aria-current=page]{color:#c4b5fd}
.actionbar{flex:none;display:flex;gap:10px;padding:10px 16px;background:#131318;border-top:1px solid #2a2a34}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 18px;border-radius:12px;font:650 15px/1.25 system-ui,'Segoe UI',Roboto,sans-serif;cursor:pointer;text-decoration:none;border:1px solid transparent;box-sizing:border-box}
.btn-primary{background:#a78bfa;color:#1a1030}
.btn-primary:hover{background:#c4b5fd;color:#1a1030}
.btn-secondary{background:#24242e;color:#f4f3f8;border-color:#43424f}
.btn-secondary:hover{background:#2c2c38;color:#f4f3f8}
.seg{display:flex;padding:3px;gap:3px;background:#0f0f14;border:1px solid #2f2f3a;border-radius:12px}
.seg-item{flex:1 1 0;min-height:40px;padding:0 6px;border:0;border-radius:9px;background:transparent;color:#b7b5c3;font:600 14px/1.2 system-ui,'Segoe UI',Roboto,sans-serif;cursor:pointer}
.seg-item[aria-pressed=true]{background:#2c2c38;color:#f4f3f8;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.chip{min-height:44px;padding:0 4px;border-radius:12px;border:1px solid #34343f;background:#1b1b23;color:#f4f3f8;font:600 14px/1 system-ui,'Segoe UI',Roboto,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:rgba(167,139,250,.2);border-color:#a78bfa}
.chip[disabled]{opacity:.35;cursor:not-allowed}
.ex{min-height:40px;padding:0 12px;border-radius:20px;border:1px solid #43424f;background:transparent;color:#f4f3f8;font:500 13px/1 ui-monospace,Consolas,monospace;cursor:pointer}
.cell{border:0;padding:0;aspect-ratio:1/1;border-radius:3px;font:650 9px/1 system-ui,'Segoe UI',Roboto,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:0;letter-spacing:-.02em}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8a8899}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
.sheet{background:#1b1b23;border-radius:20px 20px 0 0;padding:8px 16px 20px;border-top:1px solid #34343f;display:flex;flex-direction:column;gap:14px}
.handle{width:40px;height:4px;border-radius:2px;background:#55546a;margin:4px auto 0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #a78bfa;outline-offset:2px}
input,textarea{width:100%;font:inherit;color:#f4f3f8;background:#131318;border:1px solid #43424f;border-radius:12px;padding:0 14px;min-height:48px;box-sizing:border-box}
</style>
</head>
<body>
<div id="app" style="width:390px;margin:0 auto"></div>
<script type="text/x-template" id="dc-template">

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #131318; color: #b7b5c3; font: 15px/1.45 system-ui, 'Segoe UI', Roboto, sans-serif">

  <header class="topbar">
    <span class="ttl">Ranges</span>
    <a href="account.html" class="iconbtn" aria-label="Account"><span class="avatar">P</span></a>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 16px">
    <div class="seg" role="group" aria-label="How to describe the spot">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3"><button type="button" class="seg-item" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}">{{m.label}}</button></sc-for>
    </div>

    <sc-if value="{{isPick}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span class="label" id="seat">Your seat</span>
          <div role="group" aria-labelledby="seat" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{positions}}" as="p" hint-placeholder-count="6"><button type="button" class="chip" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}">{{p.label}}</button></sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span class="label">Before you</span>
          <div class="seg" role="group" aria-label="What happened before you">
            <sc-for list="{{situations}}" as="s" hint-placeholder-count="2"><button type="button" class="seg-item" aria-pressed="{{s.pressed}}" disabled="{{s.disabled}}" onClick="{{s.pick}}" style="min-height: 44px">{{s.label}}</button></sc-for>
          </div>
        </div>
        <sc-if value="{{showRaiser}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span class="label" id="raiser">Who raised?</span>
            <div role="group" aria-labelledby="raiser" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
              <sc-for list="{{raisers}}" as="p" hint-placeholder-count="3"><button type="button" class="chip" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}">{{p.label}}</button></sc-for>
            </div>
          </div>
        </sc-if>
        <div style="display: flex; align-items: center; gap: 12px">
          <span class="label" id="stack" style="flex: none">Stack</span>
          <div class="seg" role="group" aria-labelledby="stack" style="flex: 1">
            <sc-for list="{{stacks}}" as="s" hint-placeholder-count="2"><button type="button" class="seg-item" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}">{{s.label}}</button></sc-for>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isType}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px">Type the spot<input type="text" value="{{typed}}"></label>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{examples}}" as="e" hint-placeholder-count="3"><button type="button" class="ex" onClick="{{e.pick}}">{{e.label}}</button></sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isPaste}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px">Paste a hand history (PokerStars, 6-max)
          <textarea rows="5" style="padding: 10px 12px; font: 12px/1.5 ui-monospace, Consolas, monospace">PokerStars Hand #1: Hold'em No Limit ($0.50/$1.00 USD)
Table 'Atlas' 6-max Seat #4 is the button
...</textarea>
        </label>
        <button type="button" class="btn btn-secondary">Read hand</button>
      </div>
    </sc-if>

    <div style="height: 1px; background: #2a2a34"></div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 20px; font-weight: 700; color: #f4f3f8">{{title}}</h1>
      <p style="margin: 0; font-size: 13px">{{sub}}</p>
      <p style="margin: 4px 0 0; font-size: 12px; color: #8a8899">Standard chart: a starting point, not a live solve.</p>
    </div>

    <div style="display: flex; gap: 10px; align-items: center">
      <div class="seg" role="group" aria-label="Edit mode" style="flex: 1">
        <sc-for list="{{editModes}}" as="m" hint-placeholder-count="2"><button type="button" class="seg-item" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}">{{m.label}}</button></sc-for>
      </div>
      <button type="button" class="iconbtn" aria-label="Reset to the chart" onClick="{{reset}}" style="border: 1px solid #34343f; border-radius: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"></path></svg></button>
    </div>

    <div role="grid" aria-label="{{title}}" style="display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; margin: 0 -8px; padding: 4px; background: #1b1b23; border-radius: 10px; border: {{gridBorder}}">
      <sc-for list="{{cells}}" as="cell" hint-placeholder-count="169">
        <button type="button" role="gridcell" class="cell" aria-label="{{cell.aria}}" onClick="{{cell.pick}}" style="background: {{cell.bg}}; color: {{cell.fg}}">{{cell.label}}</button>
      </sc-for>
    </div>
    <span style="font-size: 13px; color: #f4f3f8; font-variant-numeric: tabular-nums"><strong>{{pct}}%</strong> of all hands · {{combos}} combos{{editedNote}}</span>
  </main>

  <div class="actionbar">
    <button type="button" class="btn btn-secondary" style="flex: 0 0 110px">Save</button>
    <a href="solve-1-hand.html" class="btn btn-primary" style="flex: 1">Solve a flop from here</a>
  </div>

  <nav class="tabbar" aria-label="Main">
    <a class="tab" href="solve-1-hand.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>Solve</a>
    <a class="tab" href="ranges.html" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>Ranges</a>
    <a class="tab" href="library.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4V3z"></path></svg>Library</a>
    <a class="tab" href="#drill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="11" height="15" rx="2"></rect><path d="M9 3h10a2 2 0 0 1 2 2v12"></path></svg>Drill</a>
  </nav>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
    <div class="scrim">
      <section class="sheet" role="dialog" aria-label="Edit hand">
        <span class="handle" aria-hidden="true"></span>
        <div style="display: flex; justify-content: space-between; align-items: flex-start">
          <div>
            <p style="margin: 0; font-size: 30px; font-weight: 750; color: #f4f3f8">{{selHand}}</p>
            <p style="margin: 0; font-size: 13px">{{selDesc}}</p>
          </div>
          <button type="button" class="iconbtn" aria-label="Close" onClick="{{close}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </div>
        <p style="margin: 0; color: #f4f3f8; font-weight: 600">How often do you play it here?</p>
        <div role="group" aria-label="Weight" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{weights}}" as="w" hint-placeholder-count="5"><button type="button" class="chip" aria-pressed="{{w.pressed}}" onClick="{{w.pick}}" style="min-height: 52px">{{w.label}}</button></sc-for>
        </div>
        <button type="button" class="btn btn-primary" onClick="{{close}}">Done</button>
      </section>
    </div>
  </sc-if>
</div>
</script>
<script type="text/x-dc-logic" id="dc-logic">
var R = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
var SEATS = ['UTG', 'HJ', 'CO', 'BTN', 'SB', 'BB'];
function ix(c) { return R.indexOf(c); }
function handAt(r, c) { if (r === c) return R[r] + R[c]; return r < c ? R[r] + R[c] + 's' : R[c] + R[r] + 'o'; }
function buildRange(pairMin, suited, off, over) {
  var m = {};
  for (var r = 0; r < 13; r++) for (var c = 0; c < 13; c++) {
    var h = handAt(r, c), w = 0;
    if (r === c) w = r <= ix(pairMin) ? 1 : 0;
    else if (r < c) w = suited[R[r]] && c <= ix(suited[R[r]]) ? 1 : 0;
    else w = off[R[c]] && r <= ix(off[R[c]]) ? 1 : 0;
    if (over && over[h] !== undefined) w = over[h];
    if (w > 0) m[h] = w;
  }
  return m;
}
function combosOf(h) { return h.length === 2 ? 6 : (h[2] === 's' ? 4 : 12); }
function kind(h) { return h.length === 2 ? 'pocket pair' : (h[2] === 's' ? 'suited' : 'offsuit'); }
function look(w) {
  if (!w) return { bg: '#2b2b34', fg: '#9896a6' };
  if (w >= 1) return { bg: '#46b06a', fg: '#0f1a12' };
  var p = Math.round(w * 100);
  return { bg: 'linear-gradient(to top, #46b06a ' + p + '%, #3a3a46 ' + p + '%)', fg: '#f4f3f8' };
}
var OPEN = {
  UTG: buildRange('4', { A: '2', K: '9', Q: 'T', J: 'T', T: '9' }, { A: 'T', K: 'J', Q: 'J' }),
  HJ: buildRange('3', { A: '2', K: '7', Q: '9', J: '9', T: '8', '9': '8', '8': '7' }, { A: '9', K: 'T', Q: 'T', J: 'T' }),
  CO: buildRange('2', { A: '2', K: '5', Q: '8', J: '8', T: '7', '9': '7', '8': '7', '7': '6', '6': '5', '5': '4' }, { A: '7', K: '9', Q: 'T', J: 'T' }),
  BTN: buildRange('2', { A: '2', K: '2', Q: '5', J: '7', T: '6', '9': '6', '8': '6', '7': '5', '6': '5', '5': '4' }, { A: '2', K: '7', Q: '9', J: 'T' }),
  SB: buildRange('2', { A: '2', K: '2', Q: '4', J: '6', T: '6', '9': '6', '8': '6', '7': '5', '6': '5', '5': '4' }, { A: '2', K: '8', Q: '9', J: '9', T: '9' })
};
var DEFEND_BB = buildRange('2', { A: '2', K: '2', Q: '4', J: '6', T: '6', '9': '6', '8': '6', '7': '5', '6': '5', '5': '4' },
  { A: '2', K: '8', Q: '9', J: '9', T: '9' }, { AA: 0.25, KK: 0.25, QQ: 0.5, AKs: 0.25, AKo: 0.25 });
var DEFEND = buildRange('2', { A: '2', K: '9', Q: 'T', J: 'T', T: '9', '9': '8', '8': '7', '7': '6', '6': '5' },
  { A: 'J', K: 'Q' }, { A5s: 0.5, A4s: 0.5, '22': 0.5, '33': 0.5 });

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'pick', pos: 'BTN', sit: 'open', raiser: 'CO', stack: 100, edit: 'tap', edits: {}, sel: null }; }
  setSpot(p) { this.setState(Object.assign({ edits: {}, sel: null }, p)); }
  renderVals() {
    var self = this, st = this.state, seat = SEATS.indexOf(st.pos);
    var sit = st.pos === 'BB' ? 'defend' : (st.pos === 'UTG' ? 'open' : st.sit);
    var earlier = SEATS.slice(0, seat);
    var raiser = earlier.indexOf(st.raiser) >= 0 ? st.raiser : earlier[earlier.length - 1];
    var range = Object.assign({}, sit === 'open' ? OPEN[st.pos] : (st.pos === 'BB' ? DEFEND_BB : DEFEND)), edited = false;
    for (var k in st.edits) { edited = true; if (st.edits[k] > 0) range[k] = st.edits[k]; else delete range[k]; }
    var n = 0; for (var h in range) n += combosOf(h) * range[h];
    function setW(hand, w) { var e = Object.assign({}, self.state.edits); e[hand] = w; self.setState({ edits: e }); }
    var cells = [];
    for (var r = 0; r < 13; r++) for (var c = 0; c < 13; c++) {
      (function (hand) {
        var w = range[hand] || 0, l = look(w);
        cells.push({ label: hand, bg: l.bg, fg: l.fg, aria: hand + (w ? ', ' + Math.round(w * 100) + '%' : ', not in range'),
          pick: function () { if (st.edit === 'tap') self.setState({ sel: hand }); else setW(hand, w ? 0 : 1); } });
      })(handAt(r, c));
    }
    var selW = st.sel ? (range[st.sel] || 0) : 0;
    var title = sit === 'open' ? st.pos + ' opening range' : st.pos + ' vs a ' + raiser + ' raise';
    return {
      modes: [['pick', 'Pick'], ['type', 'Type it'], ['paste', 'Hand history']].map(function (m) {
        return { label: m[1], pressed: String(st.mode === m[0]), pick: function () { self.setState({ mode: m[0] }); } };
      }),
      isPick: st.mode === 'pick', isType: st.mode === 'type', isPaste: st.mode === 'paste',
      positions: SEATS.map(function (p) { return { label: p, pressed: String(st.pos === p), pick: function () { self.setSpot({ pos: p }); } }; }),
      situations: [['open', 'Nobody raised', st.pos === 'BB'], ['defend', 'Facing a raise', st.pos === 'UTG']].map(function (s) {
        return { label: s[1], disabled: s[2], pressed: String(sit === s[0]), pick: function () { self.setSpot({ sit: s[0] }); } };
      }),
      showRaiser: sit === 'defend',
      raisers: earlier.map(function (p) { return { label: p, pressed: String(raiser === p), pick: function () { self.setSpot({ raiser: p }); } }; }),
      stacks: [40, 100].map(function (s) { return { label: s + 'bb', pressed: String(st.stack === s), pick: function () { self.setSpot({ stack: s }); } }; }),
      typed: sit === 'open' ? st.pos + ' opens ' + st.stack + 'bb' : st.pos + ' defends ' + raiser + ' open, ' + st.stack + 'bb',
      examples: [['BTN opens 100bb', 'BTN', 'open', 'CO', 100], ['BB defends CO open, 100bb', 'BB', 'defend', 'CO', 100], ['CO opens 40bb', 'CO', 'open', 'HJ', 40]].map(function (e) {
        return { label: e[0], pick: function () { self.setSpot({ pos: e[1], sit: e[2], raiser: e[3], stack: e[4] }); } };
      }),
      title: title,
      sub: (sit === 'open' ? 'Nobody has raised yet' : raiser + ' raised; green hands continue') + ' · about ' + st.stack + 'bb · 6-max',
      editModes: [['tap', 'Tap to edit'], ['paint', 'Paint']].map(function (m) {
        return { label: m[1], pressed: String(st.edit === m[0]), pick: function () { self.setState({ edit: m[0], sel: null }); } };
      }),
      gridBorder: st.edit === 'paint' ? '2px solid #a78bfa' : '1px solid #2a2a34',
      reset: function () { self.setState({ edits: {} }); },
      cells: cells, pct: (n / 1326 * 100).toFixed(1), combos: Math.round(n), editedNote: edited ? ' · edited' : '',
      sheetOpen: !!st.sel, selHand: st.sel || '', selDesc: st.sel ? kind(st.sel) + ' · ' + combosOf(st.sel) + ' combos' : '',
      weights: [0, 0.25, 0.5, 0.75, 1].map(function (w) { return { label: Math.round(w * 100) + '%', pressed: String(selW === w), pick: function () { setW(st.sel, w); } }; }),
      close: function () { self.setState({ sel: null }); }
    };
  }
}
</script>
<script>/* Tiny standalone renderer for the mockup screens: {{holes}}, <sc-for>,
   <sc-if>, onClick handlers, and a DCLogic base class with setState. */
(function () {
  var TABLE_TAGS = ['table', 'thead', 'tbody', 'tr', 'td', 'th'];
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  function lookup(path, scope) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) {
      var v = lookup(p, scope);
      return v == null ? '' : String(v);
    });
  }

  window.DCLogic = class {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(patch) {
      this.state = Object.assign({}, this.state, typeof patch === 'function' ? patch(this.state) : patch);
      this.__rerender && this.__rerender();
    }
    forceUpdate() { this.__rerender && this.__rerender(); }
  };

  function renderNode(node, scope, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = lookup(node.getAttribute('list').replace(WHOLE, '$1'), scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        node.childNodes.forEach(function (c) { renderNode(c, s, out); });
      });
      return;
    }
    if (tag === 'sc-if') {
      if (lookup(node.getAttribute('value').replace(WHOLE, '$1'), scope)) {
        node.childNodes.forEach(function (c) { renderNode(c, scope, out); });
      }
      return;
    }
    var realTag = tag.indexOf('x-') === 0 && TABLE_TAGS.indexOf(tag.slice(2)) >= 0 ? tag.slice(2) : tag;
    var el = node.namespaceURI && node.namespaceURI !== 'http://www.w3.org/1999/xhtml'
      ? document.createElementNS(node.namespaceURI, realTag)
      : document.createElement(realTag);
    Array.prototype.forEach.call(node.attributes, function (a) {
      if (a.name.indexOf('hint-') === 0) return;
      var whole = a.value.match(WHOLE);
      if (/^on[a-z]+$/i.test(a.name) && whole) {
        var fn = lookup(whole[1], scope);
        if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn);
        return;
      }
      if (whole && a.name !== 'style') {
        var v = lookup(whole[1], scope);
        if (v === false || v == null) return;
        el.setAttribute(a.name, v === true ? '' : String(v));
        return;
      }
      el.setAttribute(a.name, interp(a.value, scope));
    });
    if (realTag === 'input' && node.hasAttribute('value')) el.value = interp(node.getAttribute('value'), scope);
    node.childNodes.forEach(function (c) { renderNode(c, scope, el.childNodes && { push: function (n) { el.appendChild(n); } }); });
    out.push(el);
  }

  window.addEventListener('DOMContentLoaded', function () {
    var src = document.getElementById('dc-template').textContent;
    TABLE_TAGS.forEach(function (t) {
      src = src.replace(new RegExp('<' + t + '(?=[\\s>])', 'g'), '<x-' + t).replace(new RegExp('</' + t + '>', 'g'), '</x-' + t + '>');
    });
    var holder = document.createElement('div');
    holder.innerHTML = src;
    var Component = new Function(document.getElementById('dc-logic').textContent + '\n;return Component;')();
    var inst = new Component({});
    var root = document.getElementById('app');
    inst.__rerender = function () {
      var out = [];
      var vals = inst.renderVals ? inst.renderVals() : {};
      holder.childNodes.forEach(function (c) { renderNode(c, vals, out); });
      root.replaceChildren.apply(root, out);
    };
    inst.__rerender();
    if (inst.componentDidMount) inst.componentDidMount();
  });
})();
</script>
