[project]
name = "poker-solver-engine"
version = "0.1.0"
description = "The CFR/MCCFR solving engine and equity calculator (Stage 5), called by apps/api."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
