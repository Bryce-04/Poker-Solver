# Local dev only. Staging/prod points apps/api and services/solver at the
# team's shared Supabase project (Postgres + auth) instead of the `db`
# service below — see .env.example.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: poker_solver
      POSTGRES_PASSWORD: poker_solver_dev
      POSTGRES_DB: poker_solver
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://poker_solver:poker_solver_dev@db:5432/poker_solver
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages/schema:/app/packages/schema

  solver:
    build:
      context: ..
      dockerfile: services/solver/Dockerfile
    env_file: ../.env
    ports:
      - "8100:8100"
    volumes:
      - ../services/solver:/app/services/solver

volumes:
  db-data:
